// Gera os confrontos organizados em RODADAS (algoritmo do círculo).
// Uma rodada é um "horário" do campeonato: cada time joga no máximo uma vez nela,
// e só quando a rodada termina é que a próxima começa.
function gerarRodadas(ids) {
  const a = ids.slice();
  if (a.length % 2) a.push(null); // bye: com número ímpar, um time folga por rodada
  const n = a.length, rodadas = [];
  for (let r = 0; r < n - 1; r++) {
    const jogos = [];
    for (let i = 0; i < n / 2; i++) {
      const x = a[i], y = a[n - 1 - i];
      if (x != null && y != null) jogos.push(r % 2 === 0 ? [x, y] : [y, x]);
    }
    rodadas.push(jogos);
    a.splice(1, 0, a.pop()); // gira mantendo o primeiro fixo
  }
  return rodadas; // [[ [a,b], [c,d] ], [ ... ], ...]
}

// Setup fixo do torneio: 2 grupos na ordem definida (sem sorteio).
function buildSetup() {
  const spec = [
    { gid: "G0", gnome: "1", teams: [
      [1, "Time Azul", "Nicolas"], [2, "Time Vermelho", "Guilherme"],
      [3, "Time Preto", "Schultz"], [4, "Time Branco", "Filipe"],
    ]},
    { gid: "G1", gnome: "2", teams: [
      [5, "Time Roxo", "Fernando"], [6, "Time Amarelo", "Everton"],
      [7, "Time Laranja", "Tupy"], [8, "Time Verde", "Victor"],
    ]},
  ];
  const times = [], grupos = [], matches = [];
  let mc = 1;
  spec.forEach((g) => {
    const ids = [];
    g.teams.forEach(([tid, nome, jog]) => {
      times.push({ id: tid, nome, jogadores: [{ id: 100 + tid, numero: "", nome: jog, posicao: "ATA" }] });
      ids.push(tid);
    });
    grupos.push({ id: g.gid, nome: g.gnome, timeIds: ids });
    gerarRodadas(ids).forEach((jogos, ri) => {
      jogos.forEach(([a, b]) => {
        matches.push({ id: "M" + (mc++), ko: false, grupoId: g.gid, rodada: ri + 1, timeA: a, timeB: b, eventos: [], finalizada: false });
      });
    });
  });
  return { times, grupos, matches };
}
const SETUP = buildSetup();

// Lê um arquivo de imagem e devolve um data URL redimensionado (máx. `max` px de lado).
function fileParaDataURL(file, max, cb) {
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const escala = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.round(img.width * escala), h = Math.round(img.height * escala);
      const cv = document.createElement("canvas");
      cv.width = w; cv.height = h;
      cv.getContext("2d").drawImage(img, 0, 0, w, h);
      try { cb(cv.toDataURL("image/png")); } catch (e) { cb(null); }
    };
    img.onerror = () => cb(null);
    img.src = reader.result;
  };
  reader.onerror = () => cb(null);
  reader.readAsDataURL(file);
}

async function hashSenha(s) {
  try {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("copa2026:" + s));
    return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
  } catch (e) { return "x" + (s || "").length; }
}

      for (let i = 0; i < g.timeIds.length; i++)
        for (let j = i + 1; j < g.timeIds.length; j++)
          ms.push({ id: "M" + (idc++), ko: false, grupoId: g.id, timeA: g.timeIds[i], timeB: g.timeIds[j], eventos: [], finalizada: false });
    });
    setGrupos(gs);
    setMatches(ms);
    setBracket(null);
    setAtiva(null);
  };
  const refazer = () => { setGrupos([]); setMatches([]); setBracket(null); setAtiva(null); };
  const [confirmRestart, setConfirmRestart] = useState(false);
  const [confirmZerarTudo, setConfirmZerarTudo] = useState(false);
  // Zera SOMENTE os placares e reordena os jogos em rodadas equilibradas.
  // Preserva times, jogadores, nomes editados e escudos.
  const zerarResultados = () => {
    let mc = 1;
    const novos = [];
    grupos.forEach((g) => {
      gerarRodadas(g.timeIds).forEach((jogos, ri) => {
        jogos.forEach(([a, b]) => {
          novos.push({ id: "M" + (mc++), ko: false, grupoId: g.id, rodada: ri + 1, timeA: a, timeB: b, eventos: [], finalizada: false });
        });
      });
    });
    setMatches(novos);
    setBracket(null); setAtiva(null); setConfirmRestart(false);
  };
  // Recomeça do zero: recria times/grupos/jogos a partir do setup fixo (apaga cadastro).
  const montarGrupos = () => {
    const s = buildSetup();
    setTimes(s.times); setGrupos(s.grupos); setMatches(s.matches);
    setBracket(null); setAtiva(null); setConfirmRestart(false); setConfirmZerarTudo(false);
  };

  // ------- eventos de partida -------
  const addEvento = (mid, ev) =>
    setMatches((prev) => prev.map((m) => m.id === mid ? { ...m, eventos: [...m.eventos, { ...ev, id: Date.now() + Math.random() }] } : m));
  const removeEvento = (mid, eid) =>
    setMatches((prev) => prev.map((m) => m.id === mid ? { ...m, eventos: m.eventos.filter((e) => e.id !== eid) } : m));
  const setPen = (mid, side, val) =>
    setMatches((prev) => prev.map((m) => m.id === mid ? { ...m, [side]: val === "" ? null : Math.max(0, +val) } : m));
  const toggleFim = (mid) =>
    setMatches((prev) => prev.map((m) => m.id === mid ? { ...m, finalizada: !m.finalizada } : m));

  // ------- contagem / helpers -------
  const golsNo = (m, teamId) => m.eventos.filter((e) => e.tipo === "gol" && e.time === teamId).length;

  // ------- classificação por grupo (com desempates FIFA) -------
  const standings = useMemo(() => {
    const out = {};
    grupos.forEach((g) => {
      const st = {};
      g.timeIds.forEach((id, idx) => (st[id] = { id, ordem: idx, pts: 0, j: 0, v: 0, e: 0, d: 0, gp: 0, gc: 0 }));
      const gm = matches.filter((m) => !m.ko && m.grupoId === g.id && m.finalizada);
      gm.forEach((m) => {
        const a = golsNo(m, m.timeA), b = golsNo(m, m.timeB);
        st[m.timeA].j++; st[m.timeB].j++;
        st[m.timeA].gp += a; st[m.timeA].gc += b;
        st[m.timeB].gp += b; st[m.timeB].gc += a;
        if (a > b) { st[m.timeA].v++; st[m.timeA].pts += 3; st[m.timeB].d++; }
        else if (b > a) { st[m.timeB].v++; st[m.timeB].pts += 3; st[m.timeA].d++; }
        else { st[m.timeA].e++; st[m.timeB].e++; st[m.timeA].pts++; st[m.timeB].pts++; }
      });
      const h2h = (x, y) => {
        let px = 0, py = 0;
        gm.forEach((m) => {
          const pair = (m.timeA === x && m.timeB === y) || (m.timeA === y && m.timeB === x);
          if (!pair) return;
          const a = golsNo(m, m.timeA), b = golsNo(m, m.timeB);
          const wa = a > b ? m.timeA : b > a ? m.timeB : null;
          if (wa === x) px += 3; else if (wa === y) py += 3; else { px++; py++; }
        });
        return py - px;
      };
      const arr = Object.values(st).sort((x, y) =>
        y.v - x.v ||
        (y.gp - y.gc) - (x.gp - x.gc) ||
        y.gp - x.gp ||
        h2h(x.id, y.id) ||
        y.pts - x.pts ||
        x.ordem - y.ordem
      );
      out[g.id] = arr;
    });
    return out;
  }, [grupos, matches, times]);

  const todosGruposFim = grupos.length > 0 &&
    matches.filter((m) => !m.ko).every((m) => m.finalizada);

  // ------- gerar mata-mata -------
  const gerarMata = () => {
    const G = grupos.length;
    if (![2, 4, 8].includes(G)) return;
    if (grupos.some((g) => g.timeIds.length < 2)) return;
    const pairs = G / 2;
    const specs = [];
    for (let p = 0; p < pairs; p++)
      specs.push({ aFrom: { g: grupos[2 * p].id, r: 0 }, bFrom: { g: grupos[2 * p + 1].id, r: 1 } });
    for (let p = 0; p < pairs; p++)
      specs.push({ aFrom: { g: grupos[2 * p + 1].id, r: 0 }, bFrom: { g: grupos[2 * p].id, r: 1 } });

    let idc = 1;
    const rounds = [];
    const round0 = specs.map((s, i) => ({
      id: "K" + (idc++), ko: true, roundIndex: 0, idx: i, fase: SIZE_LABEL[G],
      aFrom: s.aFrom, bFrom: s.bFrom, eventos: [], finalizada: false, penA: null, penB: null,
    }));
    rounds.push(round0);
    let prev = round0, s = G / 2, ri = 1;
    while (s >= 1) {
      const rnd = [];
      for (let i = 0; i < s; i++)
        rnd.push({ id: "K" + (idc++), ko: true, roundIndex: ri, idx: i, fase: SIZE_LABEL[s], eventos: [], finalizada: false, penA: null, penB: null });
      prev.forEach((m, i) => { m.nextId = rnd[Math.floor(i / 2)].id; m.nextSlot = i % 2 === 0 ? "A" : "B"; });
      rounds.push(rnd); prev = rnd;
      if (s === 1) break; s = s / 2; ri++;
    }
    const finalMatch = rounds[rounds.length - 1][0];
    let thirdId = null;
    const semi = rounds.find((r) => r.length === 2);
    if (semi) {
      thirdId = "K" + (idc++);
      const third = { id: thirdId, ko: true, roundIndex: 99, idx: 0, fase: "Disputa de 3º lugar", eventos: [], finalizada: false, penA: null, penB: null };
      semi.forEach((m, i) => { m.thirdId = thirdId; m.thirdSlot = i === 0 ? "A" : "B"; });
      rounds.push([third]);
    }
    const koMatches = rounds.flat();
    setMatches((prev) => [...prev.filter((m) => !m.ko), ...koMatches]);
    setBracket({ rounds: rounds.map((r) => r.map((m) => m.id)), finalId: finalMatch.id, thirdId });
  };

  // ------- resolver times do mata-mata (derivado) -------
  const resolve = useMemo(() => {
    const teamsByMatch = {};
    const ko = matches.filter((m) => m.ko);
    ko.forEach((m) => (teamsByMatch[m.id] = { A: null, B: null }));
    // R1
    ko.filter((m) => m.roundIndex === 0).forEach((m) => {
      teamsByMatch[m.id].A = standings[m.aFrom.g]?.[m.aFrom.r]?.id ?? null;
      teamsByMatch[m.id].B = standings[m.bFrom.g]?.[m.bFrom.r]?.id ?? null;
    });
    const byId = Object.fromEntries(ko.map((m) => [m.id, m]));
    const winnerOf = (m) => {
      const t = teamsByMatch[m.id]; if (!m.finalizada || !t.A || !t.B) return null;
      const a = golsNo(m, t.A), b = golsNo(m, t.B);
      if (a > b) return t.A; if (b > a) return t.B;
      if (m.penA != null && m.penB != null) { if (m.penA > m.penB) return t.A; if (m.penB > m.penA) return t.B; }
      return null;
    };
    const loserOf = (m) => { const w = winnerOf(m); if (!w) return null; const t = teamsByMatch[m.id]; return w === t.A ? t.B : t.A; };
    // processa por rodada
    [...ko].sort((x, y) => x.roundIndex - y.roundIndex).forEach((m) => {
      const w = winnerOf(m);
      if (w == null) return;
      if (m.nextId) teamsByMatch[m.nextId][m.nextSlot] = w;
      if (m.thirdId) teamsByMatch[m.thirdId][m.thirdSlot] = loserOf(m);
    });
    const champion = bracket ? winnerOf(byId[bracket.finalId] || {}) : null;
    const third = bracket?.thirdId ? winnerOf(byId[bracket.thirdId] || {}) : null;
    return { teamsByMatch, winnerOf, champion, third, byId };
  }, [matches, standings, bracket, times]);

  const teamsOf = (m) => m.ko ? resolve.teamsByMatch[m.id] : { A: m.timeA, B: m.timeB };

  // ------- artilharia + cartões -------
  const artilheiros = useMemo(() => {
    const mp = {};
    matches.forEach((m) => m.eventos.filter((e) => e.tipo === "gol" && !e.contra).forEach((e) => {
      const k = e.jogadorId + "-" + e.time;
      if (!mp[k]) mp[k] = { nome: e.jogadorNome, time: nomeDoTime(e.time), gols: 0 };
      mp[k].gols++;
    }));
    return Object.values(mp).sort((a, b) => b.gols - a.gols);
  }, [matches, times]);

  const cartoes = useMemo(() => {
    const mp = {};
    matches.forEach((m) => m.eventos.filter((e) => e.tipo === "amarelo" || e.tipo === "vermelho").forEach((e) => {
      const k = e.jogadorId + "-" + e.time;
      if (!mp[k]) mp[k] = { nome: e.jogadorNome, time: nomeDoTime(e.time), a: 0, v: 0 };
      if (e.tipo === "amarelo") mp[k].a++; else mp[k].v++;
    }));
    return Object.values(mp).filter((x) => x.a || x.v).sort((a, b) => (b.v - a.v) || (b.a - a.a));
  }, [matches, times]);

  // estatísticas completas + medalhas
  const estat = useMemo(() => {
    const P = {}, T = {};
    times.forEach((t) => {
      T[t.id] = { id: t.id, nome: t.nome, j: 0, v: 0, e: 0, d: 0, gp: 0, gc: 0, cs: 0, defesas: 0, penDef: 0, medalhas: [] };
      t.jogadores.forEach((j) => {
        P[j.id] = { id: j.id, nome: j.nome, numero: j.numero, timeId: t.id, time: t.nome, gols: 0, assist: 0, defesas: 0, penDef: 0, amarelos: 0, vermelhos: 0, hat: 0, poker: 0, medalhas: [] };
      });
    });
    const bumpP = (ev) => {
      const k = ev.jogadorId; if (k == null) return null;
      if (!P[k]) P[k] = { id: k, nome: ev.jogadorNome, numero: "", timeId: ev.time, time: nomeDoTime(ev.time), gols: 0, assist: 0, defesas: 0, penDef: 0, amarelos: 0, vermelhos: 0, hat: 0, poker: 0, medalhas: [] };
      return P[k];
    };
    const bumpT = (id) => { if (!T[id]) T[id] = { id, nome: nomeDoTime(id), j: 0, v: 0, e: 0, d: 0, gp: 0, gc: 0, cs: 0, defesas: 0, penDef: 0, medalhas: [] }; return T[id]; };

    matches.forEach((m) => {
      const { A, B } = teamsOf(m);
      if (!A || !B) return;
      const golsMatch = {};
      m.eventos.forEach((ev) => {
        if (ev.tipo === "gol" && !ev.contra) { const p = bumpP(ev); if (p) { p.gols++; golsMatch[ev.jogadorId] = (golsMatch[ev.jogadorId] || 0) + 1; } }
        else if (ev.tipo === "assist") { const p = bumpP(ev); if (p) p.assist++; }
        else if (ev.tipo === "defesa") { const p = bumpP(ev); if (p) p.defesas++; const t = bumpT(ev.time); if (t) t.defesas++; }
        else if (ev.tipo === "penaltiDef") { const p = bumpP(ev); if (p) p.penDef++; const t = bumpT(ev.time); if (t) t.penDef++; }
        else if (ev.tipo === "amarelo") { const p = bumpP(ev); if (p) p.amarelos++; }
        else if (ev.tipo === "vermelho") { const p = bumpP(ev); if (p) p.vermelhos++; }
      });
      Object.keys(golsMatch).forEach((pid) => { if (P[pid]) { if (golsMatch[pid] >= 3) P[pid].hat++; if (golsMatch[pid] >= 4) P[pid].poker++; } });
      if (m.finalizada) {
        const a = golsNo(m, A), b = golsNo(m, B), ta = bumpT(A), tb = bumpT(B);
        ta.j++; tb.j++; ta.gp += a; ta.gc += b; tb.gp += b; tb.gc += a;
        if (a > b) { ta.v++; tb.d++; } else if (b > a) { tb.v++; ta.d++; } else { ta.e++; tb.e++; }
        if (b === 0) ta.cs++; if (a === 0) tb.cs++;
      }
    });

    const jogadores = Object.values(P), timesArr = Object.values(T);
    timesArr.forEach((t) => { t.pts = t.v * 3 + t.e; t.aprov = t.j ? Math.round(t.pts / (t.j * 3) * 100) : 0; });

    jogadores.forEach((p) => {
      const t = T[p.timeId];
      p.jogos = t ? t.j : 0;
      p.part = p.gols + p.assist;
      p.aprov = p.jogos ? Math.round(p.part / p.jogos * 100) : null;
      const gcTime = t ? t.gc : 0;
      const den = p.defesas + gcTime;
      p.aprovGol = (p.defesas + p.penDef) > 0 ? Math.round((den ? p.defesas / den : 1) * 100) : null;
    });

    const maxG = Math.max(0, ...jogadores.map((p) => p.gols));
    const maxA = Math.max(0, ...jogadores.map((p) => p.assist));
    jogadores.forEach((p) => {
      if (p.hat > 0) p.medalhas.push({ e: "🎩", t: "Hat-trick" });
      if (p.poker > 0) p.medalhas.push({ e: "🃏", t: "Pôquer" });
      if (maxG > 0 && p.gols === maxG) p.medalhas.push({ e: "🥇", t: "Artilheiro" });
      if (maxA > 0 && p.assist === maxA) p.medalhas.push({ e: "🤝", t: "Garçom" });
    });

    const comJogos = timesArr.filter((t) => t.j >= 2);
    const minGc = comJogos.length ? Math.min(...comJogos.map((t) => t.gc)) : null;
    timesArr.forEach((t) => {
      if (bracket && resolve.champion === t.id) t.medalhas.push({ e: "🏆", t: "Campeão" });
      if (t.j >= 2 && t.d === 0) t.medalhas.push({ e: "🛡️", t: "Invicto" });
      if (minGc !== null && t.j >= 2 && t.gc === minGc) t.medalhas.push({ e: "🧤", t: "Defesa menos vazada" });
    });

    const porTime = timesArr.slice()
      .sort((a, b) => b.pts - a.pts || (b.gp - b.gc) - (a.gp - a.gc) || b.gp - a.gp)
      .map((t) => ({ ...t, jogadores: jogadores.filter((p) => p.timeId === t.id).sort((a, b) => b.part - a.part || b.gols - a.gols || (a.nome || "").localeCompare(b.nome || "")) }));

    return {
      porTime,
      artilheiros: jogadores.filter((p) => p.gols > 0).sort((a, b) => b.gols - a.gols),
      garcons: jogadores.filter((p) => p.assist > 0).sort((a, b) => b.assist - a.assist),
      goleiros: jogadores.filter((p) => (p.defesas + p.penDef) > 0).sort((a, b) => (b.defesas + b.penDef) - (a.defesas + a.penDef)),
      medalhasJog: jogadores.filter((p) => p.medalhas.length > 0),
      medalhasTime: timesArr.filter((t) => t.medalhas.length > 0),
      tabelaTimes: timesArr.slice().sort((a, b) => b.pts - a.pts || (b.gp - b.gc) - (a.gp - a.gc) || b.gp - a.gp),
    };
  }, [matches, times, bracket, resolve]);

  // =================== CARREGANDO (banco) ===================
  if (!carregado) {
    return (
      <div style={{ ...S.app, alignItems: "center", justifyContent: "center" }}>
        <div style={{ color: "#64748b", fontSize: 14, display: "flex", alignItems: "center", gap: 8 }}>
          <RefreshCw size={16} /> Carregando dados salvos…
        </div>
      </div>
    );
  }

  // =================== TELA DE PARTIDA ===================
  if (ativa) {
    const m = matches.find((x) => x.id === ativa);
    if (!m) { setAtiva(null); return null; }
    const { A, B } = teamsOf(m);
    const tA = timeObj(A), tB = timeObj(B);
    const gA = A ? golsNo(m, A) : 0, gB = B ? golsNo(m, B) : 0;
    const empate = m.finalizada && gA === gB;
    const precisaPen = m.ko && empate;
    const penInvalido = precisaPen && (m.penA == null || m.penB == null || m.penA === m.penB);

    return (
      <div style={S.app}>
        <div style={S.header}>
          <button style={S.iconBtn} onClick={() => setAtiva(null)}><ChevronLeft size={22} /></button>
          <span style={S.headerTitle}>{m.fase || "Fase de grupos"}</span>
          {edit ? (
            <button style={{ ...S.iconBtn, color: m.finalizada ? "#22c55e" : "#94a3b8" }}
              onClick={() => { if (!(precisaPen && penInvalido)) toggleFim(m.id); }}>
              <Flag size={20} />
            </button>
          ) : <span style={{ width: 22 }} />}
        </div>

        <div style={S.scoreBoard}>
          <div style={S.scoreTeam}>
            <div style={{ display: "flex", justifyContent: "center", marginBottom: 6 }}>{tA ? <Escudo time={tA} size={44} /> : <Shield size={44} color="#334155" />}</div>
            {tA?.nome || "A definir"}
          </div>
          <div style={S.scoreNums}>{gA} <span style={{ color: "#475569" }}>×</span> {gB}</div>
          <div style={S.scoreTeam}>
            <div style={{ display: "flex", justifyContent: "center", marginBottom: 6 }}>{tB ? <Escudo time={tB} size={44} /> : <Shield size={44} color="#334155" />}</div>
            {tB?.nome || "A definir"}
          </div>
        </div>
        {precisaPen && (
          <div style={S.penRow}>
            <span style={{ fontSize: 12, color: "#94a3b8" }}>Pênaltis</span>
            {edit ? (<>
              <input style={S.penInput} type="number" value={m.penA ?? ""} onChange={(e) => setPen(m.id, "penA", e.target.value)} />
              <span style={{ color: "#475569" }}>×</span>
              <input style={S.penInput} type="number" value={m.penB ?? ""} onChange={(e) => setPen(m.id, "penB", e.target.value)} />
            </>) : (<span style={{ fontSize: 14, color: "#e2e8f0" }}>{m.penA ?? "-"} × {m.penB ?? "-"}</span>)}
          </div>
        )}
        {m.finalizada && (
          <div style={{ ...S.finalBadge, color: precisaPen && penInvalido ? "#ef4444" : "#22c55e" }}>
            {precisaPen && penInvalido ? "EMPATE — informe os pênaltis" : "ENCERRADA"}
          </div>
        )}

        {(!tA || !tB) ? (
          <div style={S.empty}>Aguardando os classificados das fases anteriores.</div>
        ) : edit ? (
          <div style={S.eventCols}>
            <PainelTime time={tA} adv={tB} mid={m.id} add={addEvento} />
            <PainelTime time={tB} adv={tA} mid={m.id} add={addEvento} />
          </div>
        ) : (
          <div style={{ ...S.empty, padding: "12px 16px" }}>Somente leitura. Ative o modo organizador (aba Dados) para registrar eventos.</div>
        )}

        <div style={S.section}>
          <div style={S.sectionTitle}><ListOrdered size={16} /> Eventos</div>
          {m.eventos.length === 0 && <div style={S.empty}>Registre gols e cartões acima.</div>}
          {[...m.eventos].reverse().map((e) => (
            <div key={e.id} style={S.eventRow}>
              <span style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <EvIcon e={e} />
                <span><b>{e.jogadorNome}</b><span style={{ color: "#64748b" }}> — {nomeDoTime(e.time)}</span>
                  {e.contra && <span style={{ color: "#ef4444", fontSize: 12 }}> (contra)</span>}</span>
              </span>
              {edit && <button style={S.miniDel} onClick={() => removeEvento(m.id, e.id)}><X size={14} /></button>}
            </div>
          ))}
        </div>
      </div>
    );
  }

  // =================== APP PRINCIPAL ===================
  return (
    <div style={S.app}>
      <div style={S.header}>
        <Trophy size={22} color="#f59e0b" />
        <span style={S.headerTitle}>Copa de Futebol</span>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          {cloudOn
            ? <span style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11, color: nuvem === "ok" ? "#22c55e" : nuvem === "erro" ? "#ef4444" : "#eab308" }}>
                <span style={{ width: 7, height: 7, borderRadius: "50%", background: nuvem === "ok" ? "#22c55e" : nuvem === "erro" ? "#ef4444" : "#eab308", display: "inline-block" }} />
                {isOrg ? "Organizador" : "Ao vivo"}
              </span>
            : <StatusPill status={status} />}
          <button style={S.iconBtn} title="Dados e organizador"
            onClick={() => setTela(tela === "dados" ? "times" : "dados")}>
            <Database size={18} color={tela === "dados" ? "#3b82f6" : "#64748b"} />
          </button>
        </div>
      </div>

      {/* -------- TIMES -------- */}
      {tela === "times" && (
        <div style={S.body}>
          {grupos.length > 0 && edit && <div style={S.lock}>Times travados — o sorteio já foi feito. Use Reiniciar na aba Grupos para zerar.</div>}
          {grupos.length === 0 && edit && (
            <div style={S.inputRow}>
              <input style={S.input} placeholder="Nome do time" value={nomeTime}
                onChange={(e) => setNomeTime(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addTime()} />
              <button style={S.addBtn} onClick={addTime}><Plus size={18} /></button>
            </div>
          )}
          {times.length === 0 && <div style={S.empty}>Adicione os times participantes.</div>}
          {times.map((t) => (
            <div key={t.id} style={S.card}>
              <div style={S.cardHead} onClick={() => setExpand(expand === t.id ? null : t.id)}>
                <span style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <Escudo time={t} size={22} /><b>{t.nome || "Sem nome"}</b>
                  <span style={S.badge}>{t.jogadores.length} jog.</span>
                </span>
                {grupos.length === 0 && edit && <button style={S.miniDel} onClick={(e) => { e.stopPropagation(); removeTime(t.id); }}><Trash2 size={16} /></button>}
              </div>
              {expand === t.id && (
                <div style={S.cardBody}>
                  {edit && (<>
                  <div style={{ padding: "10px 0", borderBottom: "1px solid #263449" }}>
                    <div style={{ fontSize: 12, color: "#94a3b8", marginBottom: 6 }}>Nome do time</div>
                    <input style={{ ...S.input, width: "100%", boxSizing: "border-box" }} value={t.nome} placeholder="Nome do time"
                      onChange={(e) => renameTime(t.id, e.target.value)} />
                  </div>
                  <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 0", borderBottom: "1px solid #263449" }}>
                    <Escudo time={t} size={40} />
                    <div style={{ flex: 1, fontSize: 13, color: "#94a3b8" }}>Escudo do time</div>
                    <label style={S.uploadBtn}>
                      <ImagePlus size={15} /> {t.escudo ? "Trocar" : "Adicionar"}
                      <input type="file" accept="image/*" style={{ display: "none" }}
                        onChange={(e) => { const f = e.target.files && e.target.files[0]; if (f) fileParaDataURL(f, 128, (url) => url && setEscudo(t.id, url)); e.target.value = ""; }} />
                    </label>
                    {t.escudo && <button style={S.miniDel} onClick={() => setEscudo(t.id, null)}><X size={16} /></button>}
                  </div>
                  </>)}
                  {t.jogadores.sort((a, b) => (+a.numero || 99) - (+b.numero || 99)).map((j) => (
                    <div key={j.id} style={S.playerRow}>
                      {editJog === j.id && edit ? (
                        <div style={{ width: "100%" }}>
                          <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                            <input style={{ ...S.input, width: 46, flex: "none", textAlign: "center" }} placeholder="Nº" value={j.numero || ""}
                              onChange={(e) => updateJog(t.id, j.id, "numero", e.target.value)} />
                            <input style={S.input} placeholder="Nome" value={j.nome}
                              onChange={(e) => updateJog(t.id, j.id, "nome", e.target.value)}
                              onKeyDown={(e) => e.key === "Enter" && setEditJog(null)} />
                            <select style={{ ...S.select, width: 70, flex: "none", padding: "0 4px" }} value={j.posicao}
                              onChange={(e) => updateJog(t.id, j.id, "posicao", e.target.value)}>
                              {POS.map((p) => <option key={p} value={p}>{p}</option>)}
                            </select>
                          </div>
                          <div style={{ display: "flex", gap: 6, marginTop: 6 }}>
                            <button style={{ ...S.primaryBtn, padding: "7px" }} onClick={() => setEditJog(null)}>Pronto</button>
                            <button style={{ ...S.ghostBtn, color: "#ef4444", borderColor: "#7f1d1d", padding: "7px" }}
                              onClick={() => { removeJog(t.id, j.id); setEditJog(null); }}>
                              <Trash2 size={14} /> Excluir
                            </button>
                          </div>
                        </div>
                      ) : (<>
                        <span><b style={{ color: "#3b82f6", display: "inline-block", width: 24 }}>{j.numero || "–"}</b>
                          {j.nome} <span style={S.posTag}>{j.posicao}</span></span>
                        {edit && (
                          <button style={S.editBtn} onClick={() => setEditJog(j.id)} title="Editar jogador">
                            <Pencil size={14} />
                          </button>
                        )}
                      </>)}
                    </div>
                  ))}
                  {edit && (
                  <div style={{ display: "flex", gap: 6, marginTop: 8 }}>
                    <input style={{ ...S.input, width: 46, flex: "none", textAlign: "center" }} placeholder="Nº" value={jNum} onChange={(e) => setJNum(e.target.value)} />
                    <input style={S.input} placeholder="Nome" value={jNome} onChange={(e) => setJNome(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addJog(t.id)} />
                    <select style={{ ...S.select, width: 70, flex: "none", padding: "0 4px" }} value={jPos} onChange={(e) => setJPos(e.target.value)}>
                      {POS.map((p) => <option key={p} value={p}>{p}</option>)}
                    </select>
                    <button style={S.addBtn} onClick={() => addJog(t.id)}><Plus size={18} /></button>
                  </div>
                  )}
                </div>
              )}
            </div>
          ))}
        </div>
      )}

      {/* -------- GRUPOS -------- */}
      {tela === "grupos" && (
        <div style={S.body}>
          {grupos.length === 0 ? (
            <div style={S.card}>
              <div style={{ ...S.sectionTitle, marginBottom: 10 }}><Users size={18} /> Grupos do torneio</div>
              <div style={{ fontSize: 13, color: "#94a3b8", marginBottom: 12 }}>Os dois grupos já estão definidos, na ordem combinada. Toque para montá-los.</div>
              {edit ? <button style={S.primaryBtn} onClick={montarGrupos}>Carregar os 2 grupos</button>
                    : <div style={S.empty}>Aguardando o organizador montar os grupos.</div>}
            </div>
          ) : (
            <>
              {edit && (
              <div style={{ marginBottom: 14 }}>
                <div style={{ display: "flex", gap: 8 }}>
                  {confirmRestart ? (
                    <>
                      <button style={{ ...S.resetConfirm, padding: "10px 12px", fontSize: 13 }} onClick={zerarResultados}>Zerar placares</button>
                      <button style={S.ghostBtn} onClick={() => setConfirmRestart(false)}>Cancelar</button>
                    </>
                  ) : (
                    <button style={S.ghostBtn} onClick={() => setConfirmRestart(true)}><RefreshCw size={15} /> Zerar placares</button>
                  )}
                  {[2, 4, 8].includes(grupos.length) && (
                    <button style={{ ...S.primaryBtn, opacity: todosGruposFim ? 1 : 0.4 }} disabled={!todosGruposFim} onClick={gerarMata}>
                      <GitMerge size={16} /> {bracket ? "Refazer chave" : "Gerar mata-mata"}
                    </button>
                  )}
                </div>
                {confirmRestart && <div style={{ fontSize: 12, color: "#94a3b8", marginTop: 8 }}>Apaga só gols, cartões e resultados. Times, jogadores e escudos são preservados.</div>}
              </div>
              )}
              {edit && !todosGruposFim && [2, 4, 8].includes(grupos.length) &&
                <div style={{ fontSize: 12, color: "#64748b", marginBottom: 12 }}>Encerre todos os jogos de grupo (🏳️) para liberar o mata-mata.</div>}

              <div style={{ fontSize: 12, color: "#94a3b8", marginBottom: 14, lineHeight: 1.5 }}>
                Todos se enfrentam dentro do grupo. Classificam-se os <b style={{ color: "#22c55e" }}>2 primeiros</b>, ordenados por número de <b style={{ color: "#3b82f6" }}>vitórias</b>. Empate em vitórias: saldo de gols → gols pró → confronto direto.
              </div>

              {grupos.map((g) => (
                <div key={g.id} style={{ marginBottom: 22 }}>
                  <div style={S.groupTitle}>Grupo {g.nome}</div>
                  <div style={S.table}>
                    <div style={{ ...S.tRow, ...S.tHead }}>
                      <span style={S.tPos}>#</span><span style={S.tName}>Time</span>
                      <span style={S.tCell}>P</span><span style={S.tCell}>J</span>
                      <span style={{ ...S.tCell, color: "#3b82f6" }}>V</span><span style={S.tCell}>E</span>
                      <span style={S.tCell}>D</span><span style={S.tCell}>SG</span>
                    </div>
                    {standings[g.id]?.map((s, i) => (
                      <div key={s.id} style={{ ...S.tRow, background: i < 2 ? "#12351f" : "transparent" }}>
                        <span style={S.tPos}>{i + 1}</span>
                        <span style={{ ...S.tName, display: "flex", alignItems: "center", gap: 6, minWidth: 0 }}>
                          <Escudo time={timeObj(s.id)} size={16} />
                          <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{nomeDoTime(s.id)}</span>
                        </span>
                        <span style={S.tCell}>{s.pts}</span>
                        <span style={S.tCell}>{s.j}</span><span style={{ ...S.tCell, fontWeight: 700, color: "#3b82f6" }}>{s.v}</span>
                        <span style={S.tCell}>{s.e}</span><span style={S.tCell}>{s.d}</span>
                        <span style={S.tCell}>{s.gp - s.gc}</span>
                      </div>
                    ))}
                  </div>
                  <div style={{ marginTop: 8 }}>
                    {(() => {
                      const jogos = matches.filter((m) => !m.ko && m.grupoId === g.id);
                      const nums = [...new Set(jogos.map((m) => m.rodada || 1))].sort((a, b) => a - b);
                      return nums.map((rn) => {
                        const doRound = jogos.filter((m) => (m.rodada || 1) === rn);
                        const fim = doRound.every((m) => m.finalizada);
                        return (
                          <div key={rn} style={{ marginBottom: 12 }}>
                            <div style={S.roundLabel}>
                              Rodada {rn}
                              {fim && <span style={S.roundDone}>concluída</span>}
                            </div>
                            {doRound.map((m) => (
                              <MatchLine key={m.id} m={m} a={m.timeA} b={m.timeB} nome={nomeDoTime} gol={golsNo} onOpen={() => setAtiva(m.id)} />
                            ))}
                          </div>
                        );
                      });
                    })()}
                  </div>
                </div>
              ))}
              {grupos.length === 1 && standings[grupos[0].id]?.length > 0 && todosGruposFim && (
                <div style={S.champBanner}><Crown size={20} /> Campeão da liga: <b>{nomeDoTime(standings[grupos[0].id][0].id)}</b></div>
              )}
            </>
          )}
        </div>
      )}

      {/* -------- MATA-MATA -------- */}
      {tela === "mata" && (
        <div style={S.body}>
          {!bracket ? (
            <div style={S.empty}>Gere o mata-mata na aba Grupos depois de encerrar a fase de grupos.</div>
          ) : (
            <>
              {resolve.champion && (
                <div style={S.champBanner}><Crown size={22} color="#0f172a" /> Campeão: <b>{nomeDoTime(resolve.champion)}</b></div>
              )}
              {resolve.third && (
                <div style={S.thirdBanner}><Award size={16} /> 3º lugar: {nomeDoTime(resolve.third)}</div>
              )}
              {bracket.rounds.map((rd, ri) => {
                const ms = rd.map((id) => matches.find((x) => x.id === id)).filter(Boolean);
                if (!ms.length) return null;
                return (
                  <div key={ri} style={{ marginBottom: 20 }}>
                    <div style={S.groupTitle}>{ms[0].fase}</div>
                    {ms.map((m) => {
                      const { A, B } = teamsOf(m);
                      return <MatchLine key={m.id} m={m} a={A} b={B} nome={nomeDoTime} gol={golsNo}
                        onOpen={A && B ? () => setAtiva(m.id) : null} pen={{ a: m.penA, b: m.penB }} />;
                    })}
                  </div>
                );
              })}
            </>
          )}
        </div>
      )}

      {/* -------- ARTILHARIA -------- */}
      {tela === "stats" && (
        <div style={S.body}>
          <div style={{ display: "flex", gap: 6, marginBottom: 14 }}>
            <button style={S.tab(statsView === "times")} onClick={() => setStatsView("times")}>Por time</button>
            <button style={S.tab(statsView === "rank")} onClick={() => setStatsView("rank")}>Rankings</button>
          </div>

          {statsView === "times" && (<>
            <div style={{ fontSize: 12, color: "#64748b", marginBottom: 10 }}>Toque num time para ver os jogadores e o que cada um fez.</div>
            {estat.porTime.map((t) => (
              <div key={t.id} style={S.card}>
                <div style={S.cardHead} onClick={() => setStatTime(statTime === t.id ? null : t.id)}>
                  <span style={{ display: "flex", alignItems: "center", gap: 8, minWidth: 0, flex: 1 }}>
                    <Escudo time={timeObj(t.id)} size={24} />
                    <span style={{ minWidth: 0 }}>
                      <b style={{ display: "block", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{t.nome}</b>
                      <span style={{ fontSize: 11, color: "#64748b" }}>{t.j} jogos · {t.v}V {t.e}E {t.d}D · SG {t.gp - t.gc >= 0 ? "+" : ""}{t.gp - t.gc}</span>
                    </span>
                  </span>
                  <span style={{ ...S.pctBig, color: t.aprov >= 60 ? "#22c55e" : t.aprov >= 34 ? "#eab308" : "#ef4444" }}>{t.j ? t.aprov + "%" : "–"}</span>
                </div>
                {statTime === t.id && (
                  <div style={S.cardBody}>
                    <div style={{ display: "flex", gap: 6, padding: "10px 0 12px" }}>
                      <div style={S.statChip}><b style={{ fontSize: 15 }}>{t.gp}</b><span style={S.chipLb}>gols pró</span></div>
                      <div style={S.statChip}><b style={{ fontSize: 15 }}>{t.gc}</b><span style={S.chipLb}>sofridos</span></div>
                      <div style={S.statChip}><b style={{ fontSize: 15 }}>{t.cs}</b><span style={S.chipLb}>sem sofrer</span></div>
                      <div style={S.statChip}><b style={{ fontSize: 15 }}>{t.defesas}</b><span style={S.chipLb}>defesas</span></div>
                    </div>
                    {t.jogadores.length === 0 && <div style={S.empty}>Nenhum jogador cadastrado neste time.</div>}
                    {t.jogadores.map((p) => {
                      const gk = (p.defesas + p.penDef) > 0;
                      const pct = gk ? p.aprovGol : p.aprov;
                      return (
                        <div key={p.id} style={S.playerStat}>
                          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                            <b style={{ color: "#3b82f6", width: 24, flex: "none" }}>{p.numero || "–"}</b>
                            <span style={{ flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{p.nome}</span>
                            <span style={{ ...S.pctSmall, color: pct == null ? "#475569" : pct >= 60 ? "#22c55e" : pct >= 30 ? "#eab308" : "#94a3b8" }}>
                              {pct == null ? "–" : pct + "%"}
                            </span>
                          </div>
                          <div style={{ fontSize: 11, color: "#94a3b8", marginTop: 4, display: "flex", flexWrap: "wrap", gap: 8 }}>
                            <span>⚽ {p.gols}</span><span>🤝 {p.assist}</span>
                            {gk && <><span>🧤 {p.defesas}</span><span>🥅 {p.penDef} pên.</span></>}
                            {(p.amarelos > 0 || p.vermelhos > 0) && <span>🟨 {p.amarelos} 🟥 {p.vermelhos}</span>}
                            <span style={{ color: "#64748b" }}>{gk ? "defesas/finalizações" : p.part + " part. em " + p.jogos + " jogos"}</span>
                          </div>
                          {p.medalhas.length > 0 && (
                            <div style={{ display: "flex", flexWrap: "wrap", gap: 4, marginTop: 5 }}>
                              {p.medalhas.map((m, i) => <span key={i} style={S.medalChip}>{m.e} {m.t}</span>)}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            ))}
          </>)}

          {statsView === "rank" && (<>
            <div style={{ ...S.sectionTitle, marginBottom: 4 }}><Goal size={18} color="#f59e0b" /> Artilheiros</div>
            {estat.artilheiros.length === 0 && <div style={S.empty}>Marque gols para ver os artilheiros.</div>}
            {estat.artilheiros.map((a, i) => (
              <div key={a.id} style={S.rankRow}>
                <span style={{ ...S.rankPos, background: i === 0 ? "#f59e0b" : i === 1 ? "#94a3b8" : i === 2 ? "#b45309" : "#334155" }}>{i + 1}</span>
                <span style={{ flex: 1, minWidth: 0 }}><b>{a.nome}</b><div style={{ fontSize: 12, color: "#64748b" }}>{a.time}</div></span>
                <span style={S.golCount}><Goal size={15} /> {a.gols}</span>
              </div>
            ))}

            {estat.garcons.length > 0 && (<>
              <div style={{ ...S.sectionTitle, margin: "22px 0 8px" }}><Handshake size={17} color="#38bdf8" /> Garçons (assistências)</div>
              {estat.garcons.map((a) => (
                <div key={a.id} style={S.rankRow}>
                  <span style={{ flex: 1, minWidth: 0 }}><b>{a.nome}</b><div style={{ fontSize: 12, color: "#64748b" }}>{a.time}</div></span>
                  <span style={{ ...S.golCount, color: "#38bdf8" }}><Handshake size={15} /> {a.assist}</span>
                </div>
              ))}
            </>)}

            {estat.goleiros.length > 0 && (<>
              <div style={{ ...S.sectionTitle, margin: "22px 0 8px" }}><Hand size={17} color="#34d399" /> Goleiros</div>
              <div style={{ fontSize: 11, color: "#64748b", marginBottom: 8 }}>% = defesas ÷ finalizações no gol (defesas + gols sofridos)</div>
              {estat.goleiros.map((a) => (
                <div key={a.id} style={S.rankRow}>
                  <span style={{ flex: 1, minWidth: 0 }}>
                    <b>{a.nome}</b>
                    <div style={{ fontSize: 12, color: "#64748b" }}>{a.time} · 🧤 {a.defesas} · 🥅 {a.penDef} pên.</div>
                  </span>
                  <span style={{ ...S.golCount, color: "#34d399" }}>{a.aprovGol == null ? "–" : a.aprovGol + "%"}</span>
                </div>
              ))}
            </>)}

            <div style={{ ...S.sectionTitle, margin: "22px 0 8px" }}><ListOrdered size={17} color="#3b82f6" /> Estatísticas dos times</div>
            <div style={S.table}>
              <div style={{ ...S.tRow, ...S.tHead }}>
                <span style={S.tName}>Time</span>
                <span style={S.tCell}>J</span><span style={S.tCell}>V</span><span style={S.tCell}>E</span>
                <span style={S.tCell}>D</span><span style={S.tCell}>SG</span><span style={{ ...S.tCell, width: 34 }}>%</span>
              </div>
              {estat.tabelaTimes.map((t) => (
                <div key={t.id} style={S.tRow}>
                  <span style={{ ...S.tName, display: "flex", alignItems: "center", gap: 6, minWidth: 0 }}>
                    <Escudo time={timeObj(t.id)} size={16} />
                    <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{t.nome}</span>
                  </span>
                  <span style={S.tCell}>{t.j}</span><span style={{ ...S.tCell, color: "#3b82f6", fontWeight: 700 }}>{t.v}</span>
                  <span style={S.tCell}>{t.e}</span><span style={S.tCell}>{t.d}</span>
                  <span style={S.tCell}>{t.gp - t.gc}</span><span style={{ ...S.tCell, width: 34 }}>{t.aprov}%</span>
                </div>
              ))}
            </div>
          </>)}
        </div>
      )}

      {/* -------- MEDALHAS -------- */}
      {tela === "medalhas" && (
        <div style={S.body}>
          <div style={{ ...S.sectionTitle, marginBottom: 4 }}><Medal size={18} color="#f59e0b" /> Medalhas dos jogadores</div>
          {estat.medalhasJog.length === 0 && <div style={S.empty}>Ainda não há medalhas. Elas aparecem conforme os jogos acontecem — hat-trick (3 gols numa partida), pôquer (4), artilheiro e garçom do torneio.</div>}
          {estat.medalhasJog.map((p) => (
            <div key={p.id} style={S.medalRow}>
              <div style={{ ...S.medalIcon, background: "#0f172a" }}>{p.medalhas[0].e}</div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <b>{p.nome}</b><div style={{ fontSize: 12, color: "#64748b" }}>{p.time}</div>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 5, marginTop: 5 }}>
                  {p.medalhas.map((m, i) => <span key={i} style={S.medalChip}>{m.e} {m.t}</span>)}
                </div>
              </div>
            </div>
          ))}

          <div style={{ ...S.sectionTitle, margin: "22px 0 8px" }}><Trophy size={18} color="#f59e0b" /> Medalhas dos times</div>
          {estat.medalhasTime.length === 0 && <div style={S.empty}>Medalhas de time (invicto, defesa menos vazada, campeão) aparecem com o andamento do torneio.</div>}
          {estat.medalhasTime.map((t) => (
            <div key={t.id} style={S.medalRow}>
              <Escudo time={timeObj(t.id)} size={34} />
              <div style={{ flex: 1, minWidth: 0 }}>
                <b>{t.nome}</b>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 5, marginTop: 5 }}>
                  {t.medalhas.map((m, i) => <span key={i} style={S.medalChip}>{m.e} {m.t}</span>)}
                </div>
              </div>
            </div>
          ))}
        </div>
      )}

      {/* -------- DADOS / BACKUP -------- */}
      {tela === "dados" && (
        <div style={S.body}>
          <div style={{ ...S.sectionTitle, marginBottom: 12 }}><Database size={18} color="#3b82f6" /> Dados e organizador</div>

          {cloudOn && (<>
            <div style={S.groupTitle}>Modo organizador</div>
            {isOrg ? (
              <div style={S.okBox}>
                Você é o <b>organizador</b>: pode editar, e o que fizer aparece nos outros aparelhos ao vivo.
                <div><button style={{ ...S.ghostBtn, marginTop: 10 }} onClick={sairOrg}>Sair do modo organizador</button></div>
              </div>
            ) : (<>
              <div style={{ fontSize: 12, color: "#94a3b8", marginBottom: 8 }}>Você vê o torneio ao vivo (somente leitura). Para editar, entre com a senha. Se ninguém definiu a senha ainda, a primeira que você digitar vira a senha oficial.</div>
              <div style={{ display: "flex", gap: 8 }}>
                <input style={{ ...S.input, width: "100%", boxSizing: "border-box" }} type="password" placeholder="Senha de organizador" value={orgInput}
                  onChange={(e) => setOrgInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && entrarOrg()} />
                <button style={S.primaryBtn} onClick={entrarOrg}>Entrar</button>
              </div>
            </>)}
            {orgMsg && <div style={{ fontSize: 13, marginTop: 8, color: orgMsg.ok ? "#22c55e" : "#ef4444" }}>{orgMsg.t}</div>}
            <div style={{ height: 1, background: "#334155", margin: "20px 0" }} />
          </>)}

          <div style={cloudOn ? (nuvem === "erro" ? S.warnBox : S.okBox) : (hasDB ? S.okBox : S.warnBox)}>
            {cloudOn
              ? (nuvem === "erro"
                  ? "Sem conexão com a nuvem no momento. Você ainda vê os últimos dados; a sincronização volta sozinha quando a internet retornar."
                  : "Conectado à nuvem. As alterações do organizador aparecem em todos os aparelhos automaticamente.")
              : (hasDB
                  ? "Salvamento automático ativo neste aparelho."
                  : "Neste ambiente o salvamento automático não está disponível. Use o código de backup abaixo.")}
          </div>

          {edit && (<>
          <div style={S.groupTitle}>Zona de risco</div>
          <div style={{ fontSize: 12, color: "#94a3b8", marginBottom: 10 }}>
            {cloudOn
              ? "Estas ações apagam o cadastro (times, jogadores, escudos) para todos os aparelhos. Para apagar só os placares, use \"Zerar placares\" na aba Grupos."
              : "Estas ações apagam o cadastro (times, jogadores, escudos). Para apagar só os placares, use \"Zerar placares\" na aba Grupos."}
          </div>
          {confirmZerarTudo ? (
            <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
              <button style={{ ...S.resetConfirm, flex: 1, padding: "10px" }} onClick={montarGrupos}>Sim, recomeçar</button>
              <button style={{ ...S.ghostBtn, flex: 1 }} onClick={() => setConfirmZerarTudo(false)}>Cancelar</button>
            </div>
          ) : (
            <button style={{ ...S.ghostBtn, color: "#f59e0b", borderColor: "#78350f", marginBottom: 10 }} onClick={() => setConfirmZerarTudo(true)}>
              <RefreshCw size={15} /> Recomeçar do zero (restaura os 8 times padrão)
            </button>
          )}
          {!cloudOn && (confirmReset ? (
            <div style={{ display: "flex", gap: 8 }}>
              <button style={{ ...S.resetConfirm, flex: 1, padding: "10px" }} onClick={apagarTudo}>Sim, apagar tudo</button>
              <button style={{ ...S.ghostBtn, flex: 1 }} onClick={() => setConfirmReset(false)}>Cancelar</button>
            </div>
          ) : (
            <button style={{ ...S.ghostBtn, color: "#ef4444", borderColor: "#7f1d1d" }} onClick={() => setConfirmReset(true)}>
              <Trash2 size={15} /> Apagar todos os dados
            </button>
          ))}
          </>)}
        </div>
      )}

      {/* -------- NAV -------- */}
      <div style={S.nav}>
        <NavBtn on={tela === "times"} click={() => setTela("times")} icon={<Users size={20} />} label="Times" />
        <NavBtn on={tela === "grupos"} click={() => setTela("grupos")} icon={<ListOrdered size={20} />} label="Grupos" />
        <NavBtn on={tela === "mata"} click={() => setTela("mata")} icon={<GitMerge size={20} />} label="Mata-mata" />
        <NavBtn on={tela === "stats"} click={() => setTela("stats")} icon={<Target size={20} />} label="Stats" />
        <NavBtn on={tela === "medalhas"} click={() => setTela("medalhas")} icon={<Medal size={20} />} label="Medalhas" />
      </div>
    </div>
  );
}

// ============ COMPONENTES ============
function MatchLine({ m, a, b, nome, gol, onOpen, pen }) {
  const gA = a ? gol(m, a) : 0, gB = b ? gol(m, b) : 0;
  return (
    <div style={{ ...S.matchCard, opacity: onOpen ? 1 : 0.7, cursor: onOpen ? "pointer" : "default" }} onClick={onOpen || undefined}>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={S.matchTeams}>{a ? nome(a) : "A definir"} <span style={{ color: "#475569" }}>×</span> {b ? nome(b) : "A definir"}</div>
        <div style={S.matchScore}>
          {gA} – {gB}
          {pen && pen.a != null && pen.b != null && <span style={{ color: "#a78bfa" }}> (pên {pen.a}-{pen.b})</span>}
          {m.finalizada && <span style={S.miniTag}>encerrada</span>}
        </div>
      </div>
      {onOpen && <Play size={20} color="#22c55e" />}
    </div>
  );
}

function PainelTime({ time, adv, mid, add }) {
  const [jog, setJog] = useState("");
  if (!time) return null;
  const reg = (tipo) => {
    const j = time.jogadores.find((x) => x.id === +jog);
    if ((tipo === "gol" || tipo === "assist" || tipo === "defesa" || tipo === "penaltiDef") && !j) return;
    add(mid, { tipo, time: time.id, jogadorId: j?.id ?? null, jogadorNome: j ? j.nome : "(sem nº)" });
    setJog("");
  };
  const contra = () => {
    const j = time.jogadores.find((x) => x.id === +jog);
    if (!j) return;
    add(mid, { tipo: "gol", time: adv.id, jogadorId: j.id, jogadorNome: j.nome, contra: true });
    setJog("");
  };
  return (
    <div style={S.panel}>
      <div style={S.panelTitle}>{time.nome}</div>
      <select style={S.selectSm} value={jog} onChange={(e) => setJog(e.target.value)}>
        <option value="">Jogador…</option>
        {time.jogadores.sort((a, b) => (+a.numero || 99) - (+b.numero || 99)).map((j) => (
          <option key={j.id} value={j.id}>{j.numero ? j.numero + " · " : ""}{j.nome}</option>
        ))}
      </select>
      <button style={{ ...S.evBtn, borderColor: "#22c55e", color: "#22c55e" }} onClick={() => reg("gol")}><Goal size={15} /> Gol</button>
      <div style={S.evGrid}>
        <button style={S.evSm("#38bdf8")} onClick={() => reg("assist")}><Handshake size={12} /> Assist.</button>
        <button style={S.evSm("#34d399")} onClick={() => reg("defesa")}><Hand size={12} /> Defesa</button>
        <button style={S.evSm("#22d3ee")} onClick={() => reg("penaltiDef")}><Hand size={12} /> Pên. def.</button>
        <button style={S.evSm("#eab308")} onClick={() => reg("amarelo")}><Square size={12} fill="#eab308" /> Amar.</button>
        <button style={S.evSm("#ef4444")} onClick={() => reg("vermelho")}><Square size={12} fill="#ef4444" /> Verm.</button>
        <button style={S.evSm("#a78bfa")} onClick={() => reg("sub")}><ArrowLeftRight size={12} /> Subst.</button>
        <button style={S.evSm("#94a3b8")} onClick={contra}><Goal size={12} /> Contra</button>
      </div>
    </div>
  );
}

function EvIcon({ e }) {
  if (e.tipo === "gol") return <Goal size={16} color={e.contra ? "#ef4444" : "#22c55e"} />;
  if (e.tipo === "assist") return <Handshake size={15} color="#38bdf8" />;
  if (e.tipo === "defesa") return <Hand size={15} color="#34d399" />;
  if (e.tipo === "penaltiDef") return <Hand size={15} color="#22d3ee" />;
  if (e.tipo === "amarelo") return <Square size={14} fill="#eab308" color="#eab308" />;
  if (e.tipo === "vermelho") return <Square size={14} fill="#ef4444" color="#ef4444" />;
  if (e.tipo === "sub") return <ArrowLeftRight size={15} color="#a78bfa" />;
  return <Goal size={16} />;
}

function StatusPill({ status }) {
  const map = {
    idle: { c: "#22c55e", t: "Salvo", dot: "#22c55e" },
    saving: { c: "#eab308", t: "Salvando…", dot: "#eab308" },
    saved: { c: "#22c55e", t: "Salvo", dot: "#22c55e" },
    error: { c: "#ef4444", t: "Erro ao salvar", dot: "#ef4444" },
    off: { c: "#64748b", t: "Só memória", dot: "#64748b" },
  };
  const s = map[status] || map.idle;
  return (
    <span style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11, color: s.c }}>
      <span style={{ width: 7, height: 7, borderRadius: "50%", background: s.dot, display: "inline-block" }} />
      {s.t}
    </span>
  );
}

function Escudo({ time, size = 20 }) {
  if (time && time.escudo)
    return <img src={time.escudo} alt="" style={{ width: size, height: size, borderRadius: 4, objectFit: "cover", display: "block", background: "#0f172a" }} />;
  return <Shield size={size} color="#3b82f6" />;
}

function NavBtn({ on, click, icon, label }) {
  return (
    <button style={{ ...S.navBtn, color: on ? "#3b82f6" : "#64748b" }} onClick={click}>
      {icon}<span style={{ fontSize: 10, marginTop: 2 }}>{label}</span>
    </button>
  );
}
