// Gera os confrontos organizados em RODADAS (algoritmo do círculo).
// Uma rodada é um "horário" do campeonato: cada time joga no máximo uma vez nela,
// e só quando a rodada termina é que a próxima começa.
function gerarRodadas(ids) {
  const a = ids.slice();
  if (a.length % 2) a.push(null); // bye: com número ímpar, um time folga por rodada
  const n = a.length, rodadas = [];
  for (let r = 0; r < n - 1; r++) {
    const jogos = [];
    for (let i = 0; i < n / 2; i++) {
      const x = a[i], y = a[n - 1 - i];
      if (x != null && y != null) jogos.push(r % 2 === 0 ? [x, y] : [y, x]);
    }
    rodadas.push(jogos);
    a.splice(1, 0, a.pop()); // gira mantendo o primeiro fixo
  }
  return rodadas; // [[ [a,b], [c,d] ], [ ... ], ...]
}

// Jogos salvos por versões antigas podem estar sem "rodada" (tudo caía na Rodada 1).
// Reorganiza só esses casos, mantendo ids, gols e resultados.
function normalizarRodadas(grupos, matches) {
  const precisa = (grupos || []).some((g) => {
    const ms = matches.filter((m) => !m.ko && m.grupoId === g.id);
    if (ms.some((m) => !m.rodada)) return true;
    const vistos = new Set();
    return ms.some((m) => [m.timeA, m.timeB].some((t) => { const k = m.rodada + ":" + t; if (vistos.has(k)) return true; vistos.add(k); return false; }));
  });
  if (!precisa) return matches;
  const rodadaDoPar = {};
  (grupos || []).forEach((g) => gerarRodadas(g.timeIds).forEach((jogos, ri) =>
    jogos.forEach(([a, b]) => { rodadaDoPar[g.id + ":" + Math.min(a, b) + "-" + Math.max(a, b)] = ri + 1; })));
  return matches.map((m) => {
    if (m.ko) return m;
    const r = rodadaDoPar[m.grupoId + ":" + Math.min(m.timeA, m.timeB) + "-" + Math.max(m.timeA, m.timeB)];
    return r ? { ...m, rodada: r } : m;
  });
}

// Prioridade fixa no 1º campo: Time Azul (1) e Time Verde (2).
// Se os dois jogarem no mesmo horário, o Time Azul fica com o 1º campo.
const PRIORIDADE = [{ nomes: ["galwan", "time azul"], id: 1 }, { nomes: ["os fieis fc", "os fieis", "time verde"], id: 8 }];
const normNome = (s) => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toLowerCase();
function idsPrioridade(times) {
  return PRIORIDADE.map((p) => {
    const t = times.find((x) => p.nomes.includes(normNome(x.nome)));
    return t ? t.id : (times.some((x) => x.id === p.id) ? p.id : null);
  });
}
// todas as formas de dividir os jogos em duplas (cada dupla = um horário, um jogo por campo)
function paresPossiveis(lista) {
  if (lista.length === 0) return [[]];
  if (lista.length === 1) return [[[lista[0]]]];
  const [primeiro, ...resto] = lista, out = [];
  if (lista.length % 2) paresPossiveis(resto).forEach((p) => out.push([[primeiro], ...p]));
  resto.forEach((par, i) => {
    const sobra = resto.filter((_, k) => k !== i);
    paresPossiveis(sobra).forEach((p) => out.push([[primeiro, par], ...p]));
  });
  return out;
}
// Sorteia uma rodada inteira: jogos que caem no mesmo horário ficam em campos diferentes.
// Preferências: (1) Azul e Verde em horários diferentes, quando der; (2) um jogo de cada
// grupo por horário. Se Azul e Verde dividirem o horário, o Azul fica com o 1º campo.
function sortearJogos(jogos, prio, rnd = Math.random) {
  const rank = (j) => (prio[0] != null && (j.A === prio[0] || j.B === prio[0])) ? 1
                    : (prio[1] != null && (j.A === prio[1] || j.B === prio[1])) ? 2 : 0;
  const custo = (par) => par.length < 2 ? 0
    : (rank(par[0]) && rank(par[1]) ? 100 : 0) + (par[0].grupoId && par[0].grupoId === par[1].grupoId ? 1 : 0);
  const opcoes = jogos.length > 10
    ? [jogos.reduce((acc, j, i) => (i % 2 ? acc[acc.length - 1].push(j) : acc.push([j]), acc), [])]
    : paresPossiveis(jogos);
  let mCusto = Infinity, validas = [];
  opcoes.forEach((p) => {
    const c = p.reduce((t, par) => t + custo(par), 0);
    if (c < mCusto) { mCusto = c; validas = [p]; } else if (c === mCusto) validas.push(p);
  });
  const horarios = [...(validas[Math.floor(rnd() * validas.length)] || [])];
  for (let i = horarios.length - 1; i > 0; i--) { const k = Math.floor(rnd() * (i + 1)); [horarios[i], horarios[k]] = [horarios[k], horarios[i]]; }
  const out = [];
  horarios.forEach((h, hi) => {
    let ordem;
    if (h.length === 1) ordem = rank(h[0]) ? [h[0]] : (rnd() < 0.5 ? [h[0]] : [null, h[0]]);
    else {
      const [x, y] = h, rx = rank(x), ry = rank(y);
      if (rx && (!ry || rx < ry)) ordem = [x, y];
      else if (ry && (!rx || ry < rx)) ordem = [y, x];
      else ordem = rnd() < 0.5 ? [x, y] : [y, x];
    }
    ordem.forEach((j, i) => { if (j) out.push({ id: j.id, campo: i + 1, horario: hi + 1 }); });
  });
  return out;
}
// confere se um sorteio salvo respeita a prioridade
function respeitaPrioridade(sjogos, jogosInfo, prio) {
  const info = Object.fromEntries(jogosInfo.map((j) => [j.id, j]));
  const rank = (id) => { const j = info[id] || {}; return (prio[0] != null && (j.A === prio[0] || j.B === prio[0])) ? 1
                    : (prio[1] != null && (j.A === prio[1] || j.B === prio[1])) ? 2 : 0; };
  const vagas = new Set(sjogos.map((j) => j.horario + "-" + j.campo));
  if (vagas.size !== sjogos.length) return false; // dois jogos no mesmo campo e horário
  return sjogos.every((j) => {
    const r = rank(j.id); if (!r) return true;
    if (j.campo === 1) return true;
    // só pode estar no 2º campo se for a prioridade 2 dividindo horário com a prioridade 1
    return r === 2 && sjogos.some((o) => o.horario === j.horario && o.id !== j.id && rank(o.id) === 1);
  });
}

// Lê um arquivo de imagem e devolve um data URL reduzido e comprimido.
// Mantemos os escudos pequenos porque eles viajam dentro do documento da nuvem,
// que tem limite de 1 MB no total.
function fileParaDataURL(file, max, cb) {
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const escala = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * escala));
      const h = Math.max(1, Math.round(img.height * escala));
      const cv = document.createElement("canvas");
      cv.width = w; cv.height = h;
      const ctx = cv.getContext("2d");
      // fundo escuro para preservar aparência de PNGs transparentes ao virar JPEG
      ctx.fillStyle = "#0f172a";
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      try {
        let out = cv.toDataURL("image/jpeg", 0.85);
        let q = 0.75;
        while (out.length > 120000 && q >= 0.4) { out = cv.toDataURL("image/jpeg", q); q -= 0.1; }
        cb(out);
      } catch (e) { cb(null); }
    };
    img.onerror = () => cb(null);
    img.src = reader.result;
  };
  reader.onerror = () => cb(null);
  reader.readAsDataURL(file);
}

async function hashSenha(s) {
  try {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("copa2026:" + s));
    return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
  } catch (e) { return "x" + (s || "").length; }
}

// Converte posições antigas (ZAG, LAT, VOL, MEI, ATA, GOL) para o novo par LINHA/GOLEIRO.
function migrarPosicoes(times) {
  return (times || []).map((t) => ({
    ...t,
    jogadores: (t.jogadores || []).map((j) => {
      const p = (j.posicao || "").toUpperCase();

      return { ...j, posicao: p === "GOL" || p === "GOLEIRO" ? "GOLEIRO" : "LINHA" };
    }),
  }));
}

// Trava de segurança: localiza arrays aninhados antes de enviar ao Firestore.
function acharArrayAninhado(obj, caminho) {
  caminho = caminho || "dados";
  if (Array.isArray(obj)) {
    for (let i = 0; i < obj.length; i++) {
      if (Array.isArray(obj[i])) return caminho + "[" + i + "]";
      const r = acharArrayAninhado(obj[i], caminho + "[" + i + "]");
      if (r) return r;
    }
  } else if (obj && typeof obj === "object") {
    for (const k of Object.keys(obj)) {
      const r = acharArrayAninhado(obj[k], caminho + "." + k);
      if (r) return r;
    }
  }
  return null;
}

// O Firestore NÃO aceita array dentro de array. O bracket guarda `rounds` como
// lista de listas, então convertemos para lista de objetos ao gravar e voltamos ao ler.
function bracketParaNuvem(b) {
  if (!b) return null;
  return {
    finalId: b.finalId || null,
    thirdId: b.thirdId || null,
    rounds: (b.rounds || []).map((ids) => ({ ids: ids || [] })),
  };
}
function bracketDaNuvem(b) {
  if (!b) return null;
  const rounds = (b.rounds || []).map((r) => (Array.isArray(r) ? r : (r && r.ids) || []));
  return { finalId: b.finalId || null, thirdId: b.thirdId || null, rounds };
}

function CopaFutebol() {
  const [tela, setTela] = useState("times"); // times | agenda | grupos | mata | artilharia
  const abriuAgenda = useRef(false);
  const [times, setTimes] = useState(SETUP.times);   // {id,nome,jogadores:[{id,numero,nome,posicao}]}
  const [grupos, setGrupos] = useState(SETUP.grupos); // {id,nome,timeIds:[]}
  const [matches, setMatches] = useState(SETUP.matches); // group + ko matches
  const [bracket, setBracket] = useState(null); // {rounds:[[ids]], finalId, thirdId}
  const [ativa, setAtiva] = useState(null); // matchId em foco
  const [statsView, setStatsView] = useState("times"); // times | rank
  const [statTime, setStatTime] = useState(null);
  const [sorteios, setSorteios] = useState({}); // { "G0-R1": {jogos:[{id,campo,horario}]}, "K0": ... }
  const [sorteando, setSorteando] = useState(null);
  const [avisoSorteio, setAvisoSorteio] = useState(null);

  // ------- persistência (banco de dados do app) -------
  const [carregado, setCarregado] = useState(false);
  const [status, setStatus] = useState(hasDB ? "idle" : "off");
  const [confirmReset, setConfirmReset] = useState(false);
  const saveTimer = useRef(null);

  // ------- nuvem / organizador -------
  const [isOrg, setIsOrg] = useState(() => {
    try { return !cloudOn || sessionStorage.getItem("copa:org") === "1"; } catch (e) { return !cloudOn; }
  });
  const [orgInput, setOrgInput] = useState("");
  const [orgMsg, setOrgMsg] = useState(null);
  const [nuvem, setNuvem] = useState(cloudOn ? "conectando" : "off"); // off | conectando | ok | erro | grande
  const [nuvemMsg, setNuvemMsg] = useState(null);
  const [escudos, setEscudos] = useState({}); // {timeId: dataURL} — vindos de documentos próprios
  const lastSynced = useRef(null);
  const edit = isOrg;

  const entrarOrg = async () => {
    const s = orgInput.trim();
    if (!s) { setOrgMsg({ ok: false, t: "Digite a senha." }); return; }
    if (!fb) { setIsOrg(true); return; }
    try {
      const h = await hashSenha(s);
      const ref = fb.collection("torneio").doc("config");
      const snap = await ref.get();
      if (!snap.exists) {
        await ref.set({ senhaHash: h });
        setIsOrg(true); try { sessionStorage.setItem("copa:org", "1"); } catch (e) {}
        setOrgMsg({ ok: true, t: "Senha definida! Você é o organizador." });
      } else if (snap.data().senhaHash === h) {
        setIsOrg(true); try { sessionStorage.setItem("copa:org", "1"); } catch (e) {}
        setOrgMsg({ ok: true, t: "Modo organizador ativado." });
      } else {
        setOrgMsg({ ok: false, t: "Senha incorreta." });
      }
    } catch (e) { setOrgMsg({ ok: false, t: "Erro ao verificar a senha." }); }
    setOrgInput("");
    setTimeout(() => setOrgMsg(null), 4000);
  };
  const sairOrg = () => { setIsOrg(false); try { sessionStorage.removeItem("copa:org"); } catch (e) {} };

  // recebe atualizações da nuvem em tempo real
  useEffect(() => {
    if (!fb) return;
    const ref = fb.collection("torneio").doc("estado");
    const unsub = ref.onSnapshot(
      (snap) => {
        setNuvem("ok");
        if (!snap.exists) return;
        const d = snap.data();
        const str = JSON.stringify({ times: migrarPosicoes(d.times || []), grupos: d.grupos || [], matches: normalizarRodadas(d.grupos || [], d.matches || []), bracket: bracketDaNuvem(d.bracket), sorteios: d.sorteios || {} });
        if (str !== lastSynced.current) {
          lastSynced.current = str;
          const o = JSON.parse(str);
          // preserva os escudos já carregados (eles vivem em documentos próprios)
          setTimes(o.times.map((t) => (escudos[t.id] ? { ...t, escudo: escudos[t.id] } : t)));
          setGrupos(o.grupos); setMatches(o.matches); setBracket(o.bracket); setSorteios(o.sorteios);
        }
      },
      () => setNuvem("erro")
    );
    return () => unsub();
  }, [escudos]);

  // escudos ficam em documentos próprios dentro de "torneio" (escudo_<id>): assim o
  // limite de 1 MB vale por escudo, e as regras da coleção já cobrem esses documentos.
  useEffect(() => {
    if (!fb) return;
    const unsub = fb.collection("torneio").onSnapshot(
      (snap) => {
        const mapa = {};
        snap.forEach((doc) => {
          if (doc.id.indexOf("escudo_") === 0) {
            const v = doc.data();
            if (v && v.img) mapa[doc.id.slice(7)] = v.img;
          }
        });
        setEscudos(mapa);
      },
      () => {}
    );
    return () => unsub();
  }, []);

  // aplica os escudos vindos da nuvem sobre os times
  useEffect(() => {
    if (!fb || !Object.keys(escudos).length) return;
    setTimes((prev) => {
      let mudou = false;
      const novo = prev.map((t) => {
        const e = escudos[String(t.id)] || escudos[t.id] || null;
        if (e && t.escudo !== e) { mudou = true; return { ...t, escudo: e }; }
        return t;
      });
      return mudou ? novo : prev;
    });
  }, [escudos]);

  // organizador envia mudanças para a nuvem (debounce)
  useEffect(() => {
    if (!fb || !carregado || !isOrg) return;
    // os escudos NÃO vão no documento principal: cada um tem o seu próprio
    const timesLeves = times.map(({ escudo, ...r }) => r);
    const cur = JSON.stringify({ times: timesLeves, grupos, matches, bracket, sorteios });
    if (cur === lastSynced.current) return;
    const t = setTimeout(async () => {
      const kb = Math.round(cur.length / 1024);
      if (cur.length > 900 * 1024) {
        setNuvem("grande");
        setNuvemMsg("Os dados do torneio estão em " + kb + " KB e o limite por documento é 1000 KB.");
        return;
      }
      try {
        const payload = { times: timesLeves, grupos, matches, bracket: bracketParaNuvem(bracket), sorteios, _at: Date.now() };
        const ruim = acharArrayAninhado(payload);
        if (ruim) {
          setNuvem("erro");
          setNuvemMsg("Estrutura inválida para a nuvem em " + ruim + ". Avise o desenvolvedor.");
          return;
        }
        lastSynced.current = cur;
        await fb.collection("torneio").doc("estado").set(payload);
        setNuvem("ok"); setNuvemMsg(null);
      } catch (e) {
        lastSynced.current = null;
        const msg = String((e && (e.message || e.code)) || "");
        if (/exceeds the maximum allowed size|too large|INVALID_ARGUMENT/i.test(msg)) {
          setNuvem("grande");
          setNuvemMsg("A nuvem recusou por tamanho (" + kb + " KB).");
        } else if (/permission|PERMISSION_DENIED|insufficient/i.test(msg)) {
          setNuvem("erro");
          setNuvemMsg("A nuvem recusou a gravação por permissão. Verifique as regras do Firestore.");
        } else {
          setNuvem("erro");
          setNuvemMsg(msg ? "Falha ao salvar: " + msg : null);
        }
      }
    }, 700);
    return () => clearTimeout(t);
  }, [times, grupos, matches, bracket, sorteios, isOrg, carregado]);

  // carrega os dados salvos ao abrir
  useEffect(() => {
    let vivo = true;
    (async () => {
      if (hasDB) {
        try {
          const raw = await dbGet(STORAGE_KEY);
          if (vivo && raw) {
            const d = JSON.parse(raw);
            if (Array.isArray(d.times) && d.times.length > 0) {
              setTimes(d.times);
              setGrupos(d.grupos || []);
              setMatches(normalizarRodadas(d.grupos || [], d.matches || []));
              setBracket(d.bracket || null);
              if (d.sorteios) setSorteios(d.sorteios);
            }
          }
        } catch (e) { /* ainda não há dados salvos */ }
      }
      if (vivo) setCarregado(true);
    })();
    return () => { vivo = false; };
  }, []);

  // salva automaticamente a cada mudança (debounce de 600ms)
  useEffect(() => {
    if (!carregado || !hasDB) return;
    clearTimeout(saveTimer.current);
    setStatus("saving");
    saveTimer.current = setTimeout(async () => {
      try {
        await dbSet(STORAGE_KEY, JSON.stringify({ times, grupos, matches, bracket, sorteios }));
        setStatus("saved");
      } catch (e) { setStatus("error"); }
    }, 600);
    return () => clearTimeout(saveTimer.current);
  }, [times, grupos, matches, bracket, sorteios, carregado]);

  const apagarTudo = async () => {
    setTimes([]); setGrupos([]); setMatches([]); setBracket(null); setAtiva(null); setSorteios({});
    setConfirmReset(false);
    if (hasDB) { try { await dbDel(STORAGE_KEY); } catch (e) {} setStatus("saved"); }
  };

  // ------- cadastro de times/jogadores -------
  const [nomeTime, setNomeTime] = useState("");
  const [expand, setExpand] = useState(null);
  const [jNome, setJNome] = useState("");
  const [jNum, setJNum] = useState("");
  const [jPos, setJPos] = useState("LINHA");
  const [editJog, setEditJog] = useState(null); // id do jogador em edição

  const nomeDoTime = (id) => times.find((t) => t.id === id)?.nome || "?";
  const timeObj = (id) => times.find((t) => t.id === id);

  const addTime = () => {
    if (!nomeTime.trim()) return;
    setTimes([...times, { id: Date.now(), nome: nomeTime.trim(), jogadores: [] }]);
    setNomeTime("");
  };
  const removeTime = (id) => {
    if (grupos.length) return; // trava edição após sorteio
    setTimes(times.filter((t) => t.id !== id));
  };
  const addJog = (tid) => {
    if (!jNome.trim()) return;
    setTimes(times.map((t) => t.id === tid
      ? { ...t, jogadores: [...t.jogadores, { id: Date.now(), nome: jNome.trim(), numero: jNum, posicao: jPos }] }
      : t));
    setJNome(""); setJNum("");
  };
  const removeJog = (tid, jid) =>
    setTimes(times.map((t) => t.id === tid ? { ...t, jogadores: t.jogadores.filter((j) => j.id !== jid) } : t));
  const updateJog = (tid, jid, campo, valor) =>
    setTimes(times.map((t) => t.id === tid
      ? { ...t, jogadores: t.jogadores.map((j) => j.id === jid ? { ...j, [campo]: valor } : j) }
      : t));
  const setEscudo = (tid, url) => {
    setTimes(times.map((t) => t.id === tid ? { ...t, escudo: url } : t));
    if (fb) {
      // Guardamos cada escudo num documento próprio DENTRO da coleção "torneio"
      // (que já é permitida pelas regras), evitando o limite de 1 MB do documento principal.
      const ref = fb.collection("torneio").doc("escudo_" + tid);
      const p = url ? ref.set({ img: url, _at: Date.now() }) : ref.delete();
      Promise.resolve(p)
        .then(() => { setNuvem("ok"); setNuvemMsg(null); })
        .catch((e) => {
          const msg = String((e && (e.message || e.code)) || "");
          if (/permission|PERMISSION_DENIED|insufficient/i.test(msg)) {
            setNuvem("erro");
            setNuvemMsg("A nuvem recusou por permissão. Verifique as regras do Firestore para a coleção \"torneio\".");
          } else if (/exceeds the maximum|too large|INVALID_ARGUMENT/i.test(msg)) {
            setNuvem("grande");
            setNuvemMsg("Esse escudo é grande demais mesmo comprimido. Tente outra imagem.");
          } else {
            setNuvem("erro");
            setNuvemMsg("Falha ao salvar o escudo: " + (msg || "erro desconhecido"));
          }
        });
    }
  };
  const renameTime = (tid, nome) =>
    setTimes(times.map((t) => t.id === tid ? { ...t, nome } : t));

  // ------- sorteio dos grupos -------
  const sortear = (n) => {
    const emb = [...times].sort(() => Math.random() - 0.5);
    const gs = Array.from({ length: n }, (_, i) => ({
      id: "G" + i, nome: String.fromCharCode(65 + i), timeIds: [],
    }));
    emb.forEach((t, i) => gs[i % n].timeIds.push(t.id));
    // fixtures: todos contra todos dentro do grupo
    const ms = [];
    let idc = 1;
    gs.forEach((g) => {
      for (let i = 0; i < g.timeIds.length; i++)
        for (let j = i + 1; j < g.timeIds.length; j++)
          ms.push({ id: "M" + (idc++), ko: false, grupoId: g.id, timeA: g.timeIds[i], timeB: g.timeIds[j], eventos: [], finalizada: false });
    });
    setGrupos(gs);
    setMatches(ms);
    setBracket(null);
    setAtiva(null);
  };
  const refazer = () => { setGrupos([]); setMatches([]); setBracket(null); setAtiva(null); };
  const [confirmRestart, setConfirmRestart] = useState(false);
  const [confirmZerarTudo, setConfirmZerarTudo] = useState(false);
  // Zera SOMENTE os placares e reordena os jogos em rodadas equilibradas.
  // Preserva times, jogadores, nomes editados e escudos.
  const zerarResultados = () => {
    let mc = 1;
    const novos = [];
    grupos.forEach((g) => {
      gerarRodadas(g.timeIds).forEach((jogos, ri) => {
        jogos.forEach(([a, b]) => {
          novos.push({ id: "M" + (mc++), ko: false, grupoId: g.id, rodada: ri + 1, timeA: a, timeB: b, eventos: [], finalizada: false });
        });
      });
    });
    setMatches(novos); setSorteios({});
    setBracket(null); setAtiva(null); setConfirmRestart(false);
  };
  // Recomeça do zero: recria times/grupos/jogos a partir do setup fixo (apaga cadastro).
  const montarGrupos = () => {
    const s = buildSetup();
    setTimes(s.times); setGrupos(s.grupos); setMatches(s.matches); setSorteios({});
    setBracket(null); setAtiva(null); setConfirmRestart(false); setConfirmZerarTudo(false);
  };

  // ------- eventos de partida -------
  const addEvento = (mid, ev) =>
    setMatches((prev) => prev.map((m) => m.id === mid ? { ...m, eventos: [...m.eventos, { ...ev, id: Date.now() + Math.random() }] } : m));
  const removeEvento = (mid, eid) =>
    setMatches((prev) => prev.map((m) => m.id === mid ? { ...m, eventos: m.eventos.filter((e) => e.id !== eid) } : m));
  const setPen = (mid, side, val) =>
    setMatches((prev) => prev.map((m) => m.id === mid ? { ...m, [side]: val === "" ? null : Math.max(0, +val) } : m));
  const toggleFim = (mid) =>
    setMatches((prev) => prev.map((m) => m.id === mid ? { ...m, finalizada: !m.finalizada } : m));

  // ------- contagem / helpers -------
  const golsNo = (m, teamId) => m.eventos.filter((e) => e.tipo === "gol" && e.time === teamId).length;

  // ------- classificação por grupo (com desempates FIFA) -------
  const standings = useMemo(() => {
    const out = {};
    grupos.forEach((g) => {
      const st = {};
      g.timeIds.forEach((id, idx) => (st[id] = { id, ordem: idx, pts: 0, j: 0, v: 0, e: 0, d: 0, gp: 0, gc: 0 }));
      const gm = matches.filter((m) => !m.ko && m.grupoId === g.id && m.finalizada);
      gm.forEach((m) => {
        const a = golsNo(m, m.timeA), b = golsNo(m, m.timeB);
        st[m.timeA].j++; st[m.timeB].j++;
        st[m.timeA].gp += a; st[m.timeA].gc += b;
        st[m.timeB].gp += b; st[m.timeB].gc += a;
        if (a > b) { st[m.timeA].v++; st[m.timeA].pts += 3; st[m.timeB].d++; }
        else if (b > a) { st[m.timeB].v++; st[m.timeB].pts += 3; st[m.timeA].d++; }
        else { st[m.timeA].e++; st[m.timeB].e++; st[m.timeA].pts++; st[m.timeB].pts++; }
      });
      const h2h = (x, y) => {
        let px = 0, py = 0;
        gm.forEach((m) => {
          const pair = (m.timeA === x && m.timeB === y) || (m.timeA === y && m.timeB === x);
          if (!pair) return;
          const a = golsNo(m, m.timeA), b = golsNo(m, m.timeB);
          const wa = a > b ? m.timeA : b > a ? m.timeB : null;
          if (wa === x) px += 3; else if (wa === y) py += 3; else { px++; py++; }
        });
        return py - px;
      };
      const arr = Object.values(st).sort((x, y) =>
        y.v - x.v ||
        (y.gp - y.gc) - (x.gp - x.gc) ||
        y.gp - x.gp ||
        h2h(x.id, y.id) ||
        y.pts - x.pts ||
        x.ordem - y.ordem
      );
      out[g.id] = arr;
    });
    return out;
  }, [grupos, matches, times]);

  const todosGruposFim = grupos.length > 0 &&
    matches.filter((m) => !m.ko).every((m) => m.finalizada);

  // ------- gerar mata-mata -------
  const gerarMata = () => {
    const G = grupos.length;
    if (![2, 4, 8].includes(G)) return;
    if (grupos.some((g) => g.timeIds.length < 2)) return;
    const pairs = G / 2;
    const specs = [];
    for (let p = 0; p < pairs; p++)
      specs.push({ aFrom: { g: grupos[2 * p].id, r: 0 }, bFrom: { g: grupos[2 * p + 1].id, r: 1 } });
    for (let p = 0; p < pairs; p++)
      specs.push({ aFrom: { g: grupos[2 * p + 1].id, r: 0 }, bFrom: { g: grupos[2 * p].id, r: 1 } });

    let idc = 1;
    const rounds = [];
    const round0 = specs.map((s, i) => ({
      id: "K" + (idc++), ko: true, roundIndex: 0, idx: i, fase: SIZE_LABEL[G],
      aFrom: s.aFrom, bFrom: s.bFrom, eventos: [], finalizada: false, penA: null, penB: null,
    }));
    rounds.push(round0);
    let prev = round0, s = G / 2, ri = 1;
    while (s >= 1) {
      const rnd = [];
      for (let i = 0; i < s; i++)
        rnd.push({ id: "K" + (idc++), ko: true, roundIndex: ri, idx: i, fase: SIZE_LABEL[s], eventos: [], finalizada: false, penA: null, penB: null });
      prev.forEach((m, i) => { m.nextId = rnd[Math.floor(i / 2)].id; m.nextSlot = i % 2 === 0 ? "A" : "B"; });
      rounds.push(rnd); prev = rnd;
      if (s === 1) break; s = s / 2; ri++;
    }
    const finalMatch = rounds[rounds.length - 1][0];
    let thirdId = null;
    const semi = rounds.find((r) => r.length === 2);
    if (semi) {
      thirdId = "K" + (idc++);
      const third = { id: thirdId, ko: true, roundIndex: 99, idx: 0, fase: "Disputa de 3º lugar", eventos: [], finalizada: false, penA: null, penB: null };
      semi.forEach((m, i) => { m.thirdId = thirdId; m.thirdSlot = i === 0 ? "A" : "B"; });
      rounds.push([third]);
    }
    const koMatches = rounds.flat();
    setMatches((prev) => [...prev.filter((m) => !m.ko), ...koMatches]);
    setBracket({ rounds: rounds.map((r) => r.map((m) => m.id)), finalId: finalMatch.id, thirdId });
  };

  // ------- resolver times do mata-mata (derivado) -------
  const resolve = useMemo(() => {
    const teamsByMatch = {};
    const ko = matches.filter((m) => m.ko);
    ko.forEach((m) => (teamsByMatch[m.id] = { A: null, B: null }));
    // R1
    ko.filter((m) => m.roundIndex === 0).forEach((m) => {
      teamsByMatch[m.id].A = standings[m.aFrom.g]?.[m.aFrom.r]?.id ?? null;
      teamsByMatch[m.id].B = standings[m.bFrom.g]?.[m.bFrom.r]?.id ?? null;
    });
    const byId = Object.fromEntries(ko.map((m) => [m.id, m]));
    const winnerOf = (m) => {
      const t = teamsByMatch[m.id]; if (!m.finalizada || !t.A || !t.B) return null;
      const a = golsNo(m, t.A), b = golsNo(m, t.B);
      if (a > b) return t.A; if (b > a) return t.B;
      if (m.penA != null && m.penB != null) { if (m.penA > m.penB) return t.A; if (m.penB > m.penA) return t.B; }
      return null;
    };
    const loserOf = (m) => { const w = winnerOf(m); if (!w) return null; const t = teamsByMatch[m.id]; return w === t.A ? t.B : t.A; };
    // processa por rodada
    [...ko].sort((x, y) => x.roundIndex - y.roundIndex).forEach((m) => {
      const w = winnerOf(m);
      if (w == null) return;
      if (m.nextId) teamsByMatch[m.nextId][m.nextSlot] = w;
      if (m.thirdId) teamsByMatch[m.thirdId][m.thirdSlot] = loserOf(m);
    });
    const champion = bracket ? winnerOf(byId[bracket.finalId] || {}) : null;
    const third = bracket?.thirdId ? winnerOf(byId[bracket.thirdId] || {}) : null;
    return { teamsByMatch, winnerOf, champion, third, byId };
  }, [matches, standings, bracket, times]);

  const teamsOf = (m) => m.ko ? resolve.teamsByMatch[m.id] : { A: m.timeA, B: m.timeB };
  // mata-mata encerrado empatado e sem pênaltis válidos: ninguém avança até preencher
  const faltaPen = (m) => {
    if (!m || !m.ko || !m.finalizada) return false;
    const t = resolve.teamsByMatch[m.id] || {}; if (!t.A || !t.B) return false;
    if (golsNo(m, t.A) !== golsNo(m, t.B)) return false;
    return !(m.penA != null && m.penB != null && m.penA !== m.penB);
  };

  // ------- sorteio dos campos -------
  // As rodadas continuam as mesmas. A Rodada N de todos os grupos acontece junta: o sorteio
  // divide esses jogos em horários (um jogo por campo) e decide o campo de cada um,
  // sempre com o Time Azul (prioridade 1) e o Time Verde (prioridade 2) no 1º campo.
  const blocoKO = (ri) => {
    const rd = (bracket && bracket.rounds[ri]) || [];
    const juntos = bracket && bracket.thirdId && (rd.includes(bracket.finalId) || rd.includes(bracket.thirdId));
    const ids = juntos ? [bracket.finalId, bracket.thirdId] : rd;
    return { key: juntos ? "KF" : "K" + ri, ids: ids.filter((id) => matches.some((x) => x.id === id)) };
  };

  // ------- ORDEM OFICIAL DOS JOGOS -------
  // Cada horário é a rodada de um grupo inteiro (os 2 jogos juntos, um em cada campo).
  // O Grupo 2 abre cada rodada: G2 R1, G1 R1, G2 R2, G1 R2, G2 R3, G1 R3.
  // Depois: intervalo, semifinais juntas, final e 3º lugar juntos.
  // Campo: Galwan sempre no 1º; Os Fiéis Fc no 1º (se coincidir com o Galwan, vai pro 2º).
  const agenda = useMemo(() => {
    const prio = idsPrioridade(times);
    const rank = (m) => { const t = teamsOf(m) || {};
      return (prio[0] != null && (t.A === prio[0] || t.B === prio[0])) ? 1 : (prio[1] != null && (t.A === prio[1] || t.B === prio[1])) ? 2 : 9; };
    const ordenar = (ms) => ms.map((m, i) => ({ m, i })).sort((x, y) => (rank(x.m) - rank(y.m)) || (x.i - y.i)).map((x) => x.m);
    const slots = [];
    const ordemGrupos = [...grupos].reverse();
    const rods = [...new Set(matches.filter((m) => !m.ko).map((m) => m.rodada || 1))].sort((x, y) => x - y);
    rods.forEach((r) => ordemGrupos.forEach((g) => {
      const ms = ordenar(matches.filter((m) => !m.ko && m.grupoId === g.id && (m.rodada || 1) === r));
      for (let i = 0; i < ms.length; i += 2)
        slots.push({ tipo: "jogo", key: g.id + "-R" + r + "-" + (i / 2), titulo: "Rodada " + r + " · Grupo " + g.nome, jogos: ms.slice(i, i + 2).map((m) => ({ m, campo: null })) });
    }));
    if (slots.length) slots.push({ tipo: "intervalo" });
    if (bracket) {
      const vistos = new Set();
      bracket.rounds.forEach((rd, ri) => {
        const juntos = bracket.thirdId && (rd.includes(bracket.finalId) || rd.includes(bracket.thirdId));
        const ids = (juntos ? [bracket.finalId, bracket.thirdId] : rd).filter((id) => !vistos.has(id));
        ids.forEach((id) => vistos.add(id));
        const ms = ids.map((id) => matches.find((x) => x.id === id)).filter(Boolean);
        if (!ms.length) return;
        const titulo = juntos ? "Final e disputa de 3º lugar" : ms[0].fase;
        for (let i = 0; i < ms.length; i += 2)
          slots.push({ tipo: "jogo", ko: true, key: (juntos ? "KF" : "K" + ri) + "-" + (i / 2), titulo, jogos: ms.slice(i, i + 2).map((m) => ({ m, campo: null })) });
      });
    } else if (slots.length) {
      const g1 = grupos[0] ? grupos[0].nome : "1", g2 = grupos[1] ? grupos[1].nome : "2";
      slots.push({ tipo: "previa", key: "K0-0", titulo: "Semifinais", linhas: [`1º Grupo ${g1} x 2º Grupo ${g2}`, `1º Grupo ${g2} x 2º Grupo ${g1}`] });
      slots.push({ tipo: "previa", key: "KF-0", titulo: "Final e disputa de 3º lugar", linhas: ["Final: vencedores das semis", "3º lugar: perdedores das semis"] });
    }
    slots.forEach((sl) => {
      if (sl.tipo === "previa") { const sv = sorteios[sl.key]; sl.pos = sv && Array.isArray(sv.pos) ? sv.pos : null; sl.sorteado = !!sl.pos; return; }
      if (sl.tipo !== "jogo") return;
      if (sl.ko) {
        const sv = sorteios[sl.key]; const pos = sv && Array.isArray(sv.pos) ? sv.pos : null;
        sl.iniciado = sl.jogos.some((j) => j.m.finalizada || (j.m.eventos || []).length > 0);
        sl.pronto = true; sl.sorteado = !!pos;
        const rk = sl.jogos.map((j) => rank(j.m)), melhor = Math.min(...rk);
        sl.regra = melhor < 9;
        if (sl.regra) sl.jogos.forEach((j, i) => { j.campo = sl.jogos.length === 1 ? 1 : (i === rk.indexOf(melhor) ? 1 : 2); });
        else if (pos) sl.jogos.forEach((j, i) => { j.campo = pos[i] || null; });
        if (sl.jogos.every((j) => j.campo)) sl.jogos.sort((x, y) => x.campo - y.campo);
        return;
      }
      const info = sl.jogos.map((j) => { const t = teamsOf(j.m) || {}; return { id: j.m.id, A: t.A || null, B: t.B || null }; });
      sl.pronto = info.every((x) => x.A && x.B);
      sl.iniciado = sl.jogos.some((j) => j.m.finalizada || (j.m.eventos || []).length > 0);
      const sv = sorteios[sl.key];
      const ids = info.map((x) => x.id).sort().join();
      const valido = sl.pronto && sv && Array.isArray(sv.jogos) && sv.jogos.map((j) => j.id).sort().join() === ids &&
        respeitaPrioridade(sv.jogos.map((j) => ({ id: j.id, campo: j.campo, horario: 1 })), info, prio);
      sl.sorteado = !!valido;
      if (valido) {
        const cm = Object.fromEntries(sv.jogos.map((j) => [j.id, j.campo]));
        sl.jogos.forEach((j) => { j.campo = cm[j.m.id]; });
        sl.jogos.sort((x, y) => x.campo - y.campo);
      }
    });
    let h = 0; const mapa = {};
    slots.forEach((sl) => {
      if (sl.tipo !== "intervalo") sl.horario = ++h;
      if (sl.tipo === "jogo") sl.jogos.forEach((j) => { mapa[j.m.id] = { campo: j.campo, horario: sl.horario }; });
    });
    const proximo = slots.findIndex((sl) => sl.tipo === "jogo" && !sl.jogos.every((j) => j.m.finalizada && !faltaPen(j.m)));
    return { slots, mapa, proximo, prio };
  }, [grupos, matches, bracket, times, resolve, sorteios]);
  const campoDe = agenda.mapa;
  useEffect(() => { // ao abrir o app com o torneio montado, mostra a ordem dos jogos
    if (!abriuAgenda.current && carregado && grupos.length > 0) { abriuAgenda.current = true; setTela((t) => t === "times" ? "agenda" : t); }
  }, [carregado, grupos.length]);

  const sortearPosicoes = (key, n) => {
    if (!edit || sorteando) return;
    setSorteando(key); setAvisoSorteio(null);
    setTimeout(() => {
      const pos = n === 1 ? [Math.random() < 0.5 ? 1 : 2] : (Math.random() < 0.5 ? [1, 2] : [2, 1]);
      setSorteios((prev) => ({ ...prev, [key]: { pos, em: Date.now() } }));
      setSorteando(null);
    }, 900);
  };

  const sortearCampos = (key, ids) => {
    if (!edit || sorteando || !ids.length) return;
    setSorteando(key);
    setAvisoSorteio(null);
    setTimeout(() => {
      try {
        const info = ids.map((id) => { const m = matches.find((x) => x.id === id); const t = (m && teamsOf(m)) || {}; return { id, A: t.A || null, B: t.B || null, grupoId: (m && m.grupoId) || null }; });
        const prio = idsPrioridade(times);
        let jogos = null;
        for (let tent = 0; tent < 20 && !jogos; tent++) {
          const r = sortearJogos(info, prio);
          if (respeitaPrioridade(r, info, prio)) jogos = r;
        }
        if (jogos) setSorteios((prev) => ({ ...prev, [key]: { jogos, em: Date.now() } }));
        else setAvisoSorteio({ key, msg: "Não deu para sortear: nesta rodada o mesmo time aparece em mais de um jogo. Confira a ordem dos jogos." });
      } catch (e) {
        setAvisoSorteio({ key, msg: "Erro no sorteio: " + ((e && e.message) || e) });
      } finally {
        setSorteando(null);
      }
    }, 900);
  };

  // botão/aviso de sorteio de uma rodada (ou fase do mata-mata)
  const barraSorteio = (key, ms) => {
    const ids = ms.map((m) => m.id);
    const feito = ids.length > 0 && ids.every((id) => campoDe[id]);
    const travado = ms.some((m) => m.finalizada || (m.eventos || []).length > 0);
    if (sorteando === key) return <div style={S.sorteioBox}>🎲 Sorteando os campos…</div>;
    const aviso = avisoSorteio && avisoSorteio.key === key
      ? <div style={{ fontSize: 12, color: "#fca5a5", margin: "0 2px 8px" }}>{avisoSorteio.msg}</div> : null;
    if (aviso && !(ids.length > 0 && ids.every((id) => campoDe[id]))) return <>{aviso}{edit && <button style={S.sorteioBtn} onClick={() => sortearCampos(key, ids)}>🎲 Tentar de novo</button>}</>;
    if (!feito) return edit
      ? <button style={S.sorteioBtn} onClick={() => sortearCampos(key, ids)}>🎲 Sortear campos{key[0] === "R" ? " da Rodada " + key.slice(1) + " (todos os grupos)" : key === "KF" ? " da Final e 3º lugar" : ""}</button>
      : <div style={S.sorteioHint}>Campos ainda não sorteados</div>;
    if (edit && !travado) return <button style={S.sorteioLink} onClick={() => sortearCampos(key, ids)}>🎲 Sortear de novo</button>;
    return null;
  };
  const porCampo = (ms) => [...ms].sort((x, y) =>
    ((campoDe[x.id]?.horario || 0) - (campoDe[y.id]?.horario || 0)) || ((campoDe[x.id]?.campo || 0) - (campoDe[y.id]?.campo || 0)));

  // ------- artilharia + cartões -------
  const artilheiros = useMemo(() => {
    const mp = {};
    matches.forEach((m) => m.eventos.filter((e) => e.tipo === "gol" && !e.contra).forEach((e) => {
      const k = e.jogadorId + "-" + e.time;
      if (!mp[k]) mp[k] = { nome: e.jogadorNome, time: nomeDoTime(e.time), gols: 0 };
      mp[k].gols++;
    }));
    return Object.values(mp).sort((a, b) => b.gols - a.gols);
  }, [matches, times]);

  const cartoes = useMemo(() => {
    const mp = {};
    matches.forEach((m) => m.eventos.filter((e) => e.tipo === "amarelo" || e.tipo === "vermelho").forEach((e) => {
      const k = e.jogadorId + "-" + e.time;
      if (!mp[k]) mp[k] = { nome: e.jogadorNome, time: nomeDoTime(e.time), a: 0, v: 0 };
      if (e.tipo === "amarelo") mp[k].a++; else mp[k].v++;
    }));
    return Object.values(mp).filter((x) => x.a || x.v).sort((a, b) => (b.v - a.v) || (b.a - a.a));
  }, [matches, times]);

  // estatísticas completas + medalhas
  const estat = useMemo(() => {
    const P = {}, T = {};
    times.forEach((t) => {
      T[t.id] = { id: t.id, nome: t.nome, j: 0, v: 0, e: 0, d: 0, gp: 0, gc: 0, cs: 0, medalhas: [] };
      t.jogadores.forEach((j) => {
        P[j.id] = { id: j.id, nome: j.nome, numero: j.numero, posicao: j.posicao, timeId: t.id, time: t.nome, gols: 0, assist: 0, amarelos: 0, vermelhos: 0, hat: 0, poker: 0, medalhas: [] };
      });
    });
    const bumpP = (ev) => {
      const k = ev.jogadorId; if (k == null) return null;
      if (!P[k]) P[k] = { id: k, nome: ev.jogadorNome, numero: "", posicao: "LINHA", timeId: ev.time, time: nomeDoTime(ev.time), gols: 0, assist: 0, amarelos: 0, vermelhos: 0, hat: 0, poker: 0, medalhas: [] };
      return P[k];
    };
    const bumpT = (id) => { if (!T[id]) T[id] = { id, nome: nomeDoTime(id), j: 0, v: 0, e: 0, d: 0, gp: 0, gc: 0, cs: 0, medalhas: [] }; return T[id]; };

    matches.forEach((m) => {
      const { A, B } = teamsOf(m);
      if (!A || !B) return;
      const golsMatch = {};
      m.eventos.forEach((ev) => {
        if (ev.tipo === "gol" && !ev.contra) { const p = bumpP(ev); if (p) { p.gols++; golsMatch[ev.jogadorId] = (golsMatch[ev.jogadorId] || 0) + 1; } }
        else if (ev.tipo === "assist") { const p = bumpP(ev); if (p) p.assist++; }
        else if (ev.tipo === "amarelo") { const p = bumpP(ev); if (p) p.amarelos++; }
        else if (ev.tipo === "vermelho") { const p = bumpP(ev); if (p) p.vermelhos++; }
      });
      Object.keys(golsMatch).forEach((pid) => { if (P[pid]) { if (golsMatch[pid] >= 3) P[pid].hat++; if (golsMatch[pid] >= 4) P[pid].poker++; } });
      if (m.finalizada) {
        const a = golsNo(m, A), b = golsNo(m, B), ta = bumpT(A), tb = bumpT(B);
        ta.j++; tb.j++; ta.gp += a; ta.gc += b; tb.gp += b; tb.gc += a;
        if (a > b) { ta.v++; tb.d++; } else if (b > a) { tb.v++; ta.d++; } else { ta.e++; tb.e++; }
        if (b === 0) ta.cs++; if (a === 0) tb.cs++;
      }
    });

    const jogadores = Object.values(P), timesArr = Object.values(T);
    timesArr.forEach((t) => { t.pts = t.v * 3 + t.e; t.aprov = t.j ? Math.round(t.pts / (t.j * 3) * 100) : 0; });

    jogadores.forEach((p) => {
      const t = T[p.timeId];
      p.jogos = t ? t.j : 0;
      p.part = p.gols + p.assist;
      p.aprov = p.jogos ? Math.round(p.part / p.jogos * 100) : null;
      // Goleiro: média de gols sofridos pelo time por jogo (menor é melhor).
      // Gols de disputa de pênaltis não entram, pois ficam no campo penA/penB.
      p.ehGoleiro = (p.posicao || "").toUpperCase() === "GOLEIRO";
      p.golsSofridos = p.ehGoleiro && t ? t.gc : 0;
      p.media = p.ehGoleiro && p.jogos ? p.golsSofridos / p.jogos : null;
    });

    const maxG = Math.max(0, ...jogadores.map((p) => p.gols));
    const maxA = Math.max(0, ...jogadores.map((p) => p.assist));
    const gks = jogadores.filter((p) => p.ehGoleiro && p.jogos > 0);
    const minMedia = gks.length ? Math.min(...gks.map((p) => p.media)) : null;
    jogadores.forEach((p) => {
      if (p.hat > 0) p.medalhas.push({ e: "🎩", t: "Hat-trick" });
      if (p.poker > 0) p.medalhas.push({ e: "🃏", t: "Pôquer" });
      if (maxG > 0 && p.gols === maxG) p.medalhas.push({ e: "🥇", t: "Artilheiro" });
      if (maxA > 0 && p.assist === maxA) p.medalhas.push({ e: "🤝", t: "Garçom" });
      if (minMedia !== null && p.ehGoleiro && p.jogos > 0 && p.media === minMedia) p.medalhas.push({ e: "🧤", t: "Goleiro menos vazado" });
    });

    const comJogos = timesArr.filter((t) => t.j >= 2);
    const minGc = comJogos.length ? Math.min(...comJogos.map((t) => t.gc)) : null;
    timesArr.forEach((t) => {
      if (bracket && resolve.champion === t.id) t.medalhas.push({ e: "🏆", t: "Campeão" });
      if (t.j >= 2 && t.d === 0) t.medalhas.push({ e: "🛡️", t: "Invicto" });
      if (minGc !== null && t.j >= 2 && t.gc === minGc) t.medalhas.push({ e: "🔒", t: "Defesa menos vazada" });
    });

    const porTime = timesArr.slice()
      .sort((a, b) => b.pts - a.pts || (b.gp - b.gc) - (a.gp - a.gc) || b.gp - a.gp)
      .map((t) => ({ ...t, jogadores: jogadores.filter((p) => p.timeId === t.id).sort((a, b) => b.part - a.part || b.gols - a.gols || (a.nome || "").localeCompare(b.nome || "")) }));

    return {
      porTime,
      artilheiros: jogadores.filter((p) => p.gols > 0).sort((a, b) => b.gols - a.gols),
      garcons: jogadores.filter((p) => p.assist > 0).sort((a, b) => b.assist - a.assist),
      goleiros: jogadores.filter((p) => p.ehGoleiro && p.jogos > 0).sort((a, b) => a.media - b.media || b.jogos - a.jogos),
      medalhasJog: jogadores.filter((p) => p.medalhas.length > 0),
      medalhasTime: timesArr.filter((t) => t.medalhas.length > 0),
      tabelaTimes: timesArr.slice().sort((a, b) => b.pts - a.pts || (b.gp - b.gc) - (a.gp - a.gc) || b.gp - a.gp),
    };
  }, [matches, times, bracket, resolve]);

  // =================== CARREGANDO (banco) ===================
  if (!carregado) {
    return (
      <div style={{ ...S.app, alignItems: "center", justifyContent: "center" }}>
        <div style={{ color: "#64748b", fontSize: 14, display: "flex", alignItems: "center", gap: 8 }}>
          <RefreshCw size={16} /> Carregando dados salvos…
        </div>
      </div>
    );
  }

  // =================== TELA DE PARTIDA ===================
  if (ativa) {
    const m = matches.find((x) => x.id === ativa);
    if (!m) { setAtiva(null); return null; }
    const { A, B } = teamsOf(m);
    const tA = timeObj(A), tB = timeObj(B);
    const gA = A ? golsNo(m, A) : 0, gB = B ? golsNo(m, B) : 0;
    const empate = m.finalizada && gA === gB;
    const precisaPen = m.ko && empate;
    const penInvalido = precisaPen && (m.penA == null || m.penB == null || m.penA === m.penB);

    return (
      <div style={S.app}>
        <div style={S.header}>
          <button style={S.iconBtn} onClick={() => setAtiva(null)}><ChevronLeft size={22} /></button>
          <span style={S.headerTitle}>{m.fase || "Fase de grupos"}{campoDe[m.id] ? " · " + campoDe[m.id].horario + "º horário" + (campoDe[m.id].campo ? " · " + campoDe[m.id].campo + "º campo" : "") : ""}</span>
          {edit ? (
            <button style={{ ...S.iconBtn, color: m.finalizada ? "#22c55e" : "#94a3b8" }}
              onClick={() => { if (!(precisaPen && penInvalido)) toggleFim(m.id); }}>
              <Flag size={20} />
            </button>
          ) : <span style={{ width: 22 }} />}
        </div>

        <div style={S.scoreBoard}>
          <div style={S.scoreTeam}>
            <div style={{ display: "flex", justifyContent: "center", marginBottom: 6 }}>{tA ? <Escudo time={tA} size={44} /> : <Shield size={44} color="#334155" />}</div>
            {tA?.nome || "A definir"}
          </div>
          <div style={S.scoreNums}>{gA} <span style={{ color: "#475569" }}>×</span> {gB}</div>
          <div style={S.scoreTeam}>
            <div style={{ display: "flex", justifyContent: "center", marginBottom: 6 }}>{tB ? <Escudo time={tB} size={44} /> : <Shield size={44} color="#334155" />}</div>
            {tB?.nome || "A definir"}
          </div>
        </div>
        {precisaPen && (
          <div style={S.penRow}>
            <span style={{ fontSize: 12, color: "#94a3b8" }}>Pênaltis</span>
            {edit ? (<>
              <input style={S.penInput} type="number" value={m.penA ?? ""} onChange={(e) => setPen(m.id, "penA", e.target.value)} />
              <span style={{ color: "#475569" }}>×</span>
              <input style={S.penInput} type="number" value={m.penB ?? ""} onChange={(e) => setPen(m.id, "penB", e.target.value)} />
            </>) : (<span style={{ fontSize: 14, color: "#e2e8f0" }}>{m.penA ?? "-"} × {m.penB ?? "-"}</span>)}
          </div>
        )}
        {m.finalizada && (
          <div style={{ ...S.finalBadge, color: precisaPen && penInvalido ? "#ef4444" : "#22c55e" }}>
            {precisaPen && penInvalido ? "EMPATE — informe os pênaltis" : "ENCERRADA"}
          </div>
        )}

        {(!tA || !tB) ? (
          <div style={S.empty}>Aguardando os classificados das fases anteriores.</div>
        ) : edit ? (
          <div style={S.eventCols}>
            <PainelTime time={tA} adv={tB} mid={m.id} add={addEvento} />
            <PainelTime time={tB} adv={tA} mid={m.id} add={addEvento} />
          </div>
        ) : (
          <div style={{ ...S.empty, padding: "12px 16px" }}>Somente leitura. Ative o modo organizador (aba Dados) para registrar eventos.</div>
        )}

        <div style={S.section}>
          <div style={S.sectionTitle}><ListOrdered size={16} /> Eventos</div>
          {m.eventos.length === 0 && <div style={S.empty}>Registre gols e cartões acima.</div>}
          {[...m.eventos].reverse().map((e) => (
            <div key={e.id} style={S.eventRow}>
              <span style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <EvIcon e={e} />
                <span><b>{e.jogadorNome}</b><span style={{ color: "#64748b" }}> — {nomeDoTime(e.time)}</span>
                  {e.contra && <span style={{ color: "#ef4444", fontSize: 12 }}> (contra)</span>}</span>
              </span>
              {edit && <button style={S.miniDel} onClick={() => removeEvento(m.id, e.id)}><X size={14} /></button>}
            </div>
          ))}
        </div>
      </div>
    );
  }

  // =================== APP PRINCIPAL ===================
  return (
    <div style={S.app}>
      <div style={S.header}>
        <Trophy size={22} color="#f59e0b" />
        <span style={S.headerTitle}>Copa de Futebol</span>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          {cloudOn
            ? <span style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11, color: nuvem === "ok" ? "#22c55e" : nuvem === "conectando" ? "#eab308" : "#ef4444" }}>
                <span style={{ width: 7, height: 7, borderRadius: "50%", background: nuvem === "ok" ? "#22c55e" : nuvem === "conectando" ? "#eab308" : "#ef4444", display: "inline-block", flex: "none" }} />
                {nuvem === "grande" ? "Dados cheios" : isOrg ? "Organizador" : "Ao vivo"}
              </span>
            : <StatusPill status={status} />}
          <button style={S.iconBtn} title="Dados e organizador"
            onClick={() => setTela(tela === "dados" ? "times" : "dados")}>
            <Database size={18} color={tela === "dados" ? "#3b82f6" : "#64748b"} />
          </button>
        </div>
      </div>

      {/* -------- TIMES -------- */}
      {tela === "times" && (
        <div style={S.body}>
          {grupos.length > 0 && edit && <div style={S.lock}>Times travados — o torneio já foi montado. Use "Zerar placares" na aba Grupos para reiniciar os jogos.</div>}
          {grupos.length === 0 && edit && (
            <div style={S.inputRow}>
              <input style={S.input} placeholder="Nome do time" value={nomeTime}
                onChange={(e) => setNomeTime(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addTime()} />
              <button style={S.addBtn} onClick={addTime}><Plus size={18} /></button>
            </div>
          )}
          {times.length === 0 && <div style={S.empty}>Adicione os times participantes.</div>}
          {times.map((t) => (
            <div key={t.id} style={S.card}>
              <div style={S.cardHead} onClick={() => setExpand(expand === t.id ? null : t.id)}>
                <span style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <Escudo time={t} size={22} /><b>{t.nome || "Sem nome"}</b>
                  <span style={S.badge}>{t.jogadores.length} jog.</span>
                </span>
                {grupos.length === 0 && edit && <button style={S.miniDel} onClick={(e) => { e.stopPropagation(); removeTime(t.id); }}><Trash2 size={16} /></button>}
              </div>
              {expand === t.id && (
                <div style={S.cardBody}>
                  {edit && (<>
                  <div style={{ padding: "10px 0", borderBottom: "1px solid #263449" }}>
                    <div style={{ fontSize: 12, color: "#94a3b8", marginBottom: 6 }}>Nome do time</div>
                    <input style={{ ...S.input, width: "100%", boxSizing: "border-box" }} value={t.nome} placeholder="Nome do time"
                      onChange={(e) => renameTime(t.id, e.target.value)} />
                  </div>
                  <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 0", borderBottom: "1px solid #263449" }}>
                    <Escudo time={t} size={40} />
                    <div style={{ flex: 1, fontSize: 13, color: "#94a3b8" }}>Escudo do time</div>
                    <label style={S.uploadBtn}>
                      <ImagePlus size={15} /> {t.escudo ? "Trocar" : "Adicionar"}
                      <input type="file" accept="image/*" style={{ display: "none" }}
                        onChange={(e) => { const f = e.target.files && e.target.files[0]; if (f) fileParaDataURL(f, 160, (url) => url && setEscudo(t.id, url)); e.target.value = ""; }} />
                    </label>
                    {t.escudo && <button style={S.miniDel} onClick={() => setEscudo(t.id, null)}><X size={16} /></button>}
                  </div>
                  </>)}
                  {t.jogadores.sort((a, b) => (+a.numero || 99) - (+b.numero || 99)).map((j) => (
                    <div key={j.id} style={S.playerRow}>
                      {editJog === j.id && edit ? (
                        <div style={{ width: "100%" }}>
                          <input style={{ ...S.input, width: "100%", boxSizing: "border-box", marginBottom: 6 }} placeholder="Nome" value={j.nome}
                            onChange={(e) => updateJog(t.id, j.id, "nome", e.target.value)}
                            onKeyDown={(e) => e.key === "Enter" && setEditJog(null)} />
                          <div style={{ display: "flex", gap: 6 }}>
                            <input style={{ ...S.input, width: 60, flex: "none", textAlign: "center", minWidth: 0 }} placeholder="Nº"
                              inputMode="numeric" value={j.numero || ""}
                              onChange={(e) => updateJog(t.id, j.id, "numero", e.target.value)} />
                            <select style={{ ...S.select, flex: 1, minWidth: 0, padding: "0 6px" }} value={j.posicao}
                              onChange={(e) => updateJog(t.id, j.id, "posicao", e.target.value)}>
                              {POS.map((p) => <option key={p} value={p}>{p}</option>)}
                            </select>
                          </div>
                          <div style={{ display: "flex", gap: 6, marginTop: 6 }}>
                            <button style={{ ...S.primaryBtn, padding: "9px" }} onClick={() => setEditJog(null)}>Pronto</button>
                            <button style={{ ...S.ghostBtn, color: "#ef4444", borderColor: "#7f1d1d", padding: "9px" }}
                              onClick={() => { removeJog(t.id, j.id); setEditJog(null); }}>
                              <Trash2 size={14} /> Excluir
                            </button>
                          </div>
                        </div>
                      ) : (<>
                        <span><b style={{ color: "#3b82f6", display: "inline-block", width: 24 }}>{j.numero || "–"}</b>
                          {j.nome} <span style={S.posTag}>{j.posicao}</span></span>
                        {edit && (
                          <button style={S.editBtn} onClick={() => setEditJog(j.id)} title="Editar jogador">
                            <Pencil size={14} />
                          </button>
                        )}
                      </>)}
                    </div>
                  ))}
                  {edit && (
                  <div style={{ marginTop: 10 }}>
                    <input style={{ ...S.input, width: "100%", boxSizing: "border-box", marginBottom: 6 }} placeholder="Nome do jogador"
                      value={jNome} onChange={(e) => setJNome(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addJog(t.id)} />
                    <div style={{ display: "flex", gap: 6 }}>
                      <input style={{ ...S.input, width: 60, flex: "none", textAlign: "center", minWidth: 0 }} placeholder="Nº"
                        inputMode="numeric" value={jNum} onChange={(e) => setJNum(e.target.value)} />
                      <select style={{ ...S.select, flex: 1, minWidth: 0, padding: "0 6px" }} value={jPos} onChange={(e) => setJPos(e.target.value)}>
                        {POS.map((p) => <option key={p} value={p}>{p}</option>)}
                      </select>
                      <button style={{ ...S.addBtn, flex: "none", padding: "0 16px" }} onClick={() => addJog(t.id)}>
                        <Plus size={18} />
                      </button>
                    </div>
                  </div>
                  )}
                </div>
              )}
            </div>
          ))}
        </div>
      )}

      {/* -------- GRUPOS -------- */}
      {tela === "agenda" && (
        <div style={S.body}>
          {agenda.slots.length === 0 ? (
            <div style={S.empty}>Monte os grupos na aba Grupos para ver a ordem dos jogos.</div>
          ) : (<>
            <div style={{ ...S.card, padding: 12 }}>
              <div style={{ ...S.sectionTitle, marginBottom: 6 }}><Clock size={17} color="#3b82f6" /> Ordem oficial dos jogos</div>
              <div style={{ fontSize: 12, color: "#94a3b8", lineHeight: 1.55 }}>
                Cada horário é a rodada de um grupo, com os 2 jogos <b style={{ color: "#e2e8f0" }}>ao mesmo tempo</b>, um em cada campo.
                Assim todo time descansa um jogo entre uma partida e outra. O campo de cada jogo é <b style={{ color: "#e2e8f0" }}>sorteado</b> pelo organizador antes do horário
                {agenda.prio.filter((x) => x != null).length > 0 ? <>, respeitando a regra: {agenda.prio.filter((x) => x != null).map((id) => nomeDoTime(id)).join(" e ")} jogam sempre no <b style={{ color: "#fde68a" }}>1º campo</b> (se jogarem juntos, {nomeDoTime(agenda.prio[0])} fica com o 1º).</> : "."}
              </div>
            </div>
            {agenda.slots.map((sl, i) => {
              if (sl.tipo === "intervalo") return (
                <div key={i} style={S.intervaloBox}>⏸️ Intervalo antes das semifinais <span style={{ color: "#64748b", fontWeight: 500 }}>· cerca de um jogo de duração</span></div>
              );
              const done = sl.tipo === "jogo" && sl.jogos.every((j) => j.m.finalizada && !faltaPen(j.m));
              const pendPen = sl.tipo === "jogo" ? sl.jogos.filter((j) => faltaPen(j.m)) : [];
              const live = sl.tipo === "jogo" && !done && sl.jogos.some((j) => (j.m.eventos || []).length > 0);
              const next = i === agenda.proximo;
              return (
                <div key={i} style={S.slotCard(next, done)}>
                  <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }}>
                    <span style={S.slotNum(next, done)}>{sl.horario}</span>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontWeight: 700, fontSize: 15 }}>{sl.horario}º horário</div>
                      <div style={{ fontSize: 12, color: "#94a3b8" }}>{sl.titulo}</div>
                    </div>
                    {pendPen.length > 0 ? <span style={S.slotChip("#7f1d1d", "#fca5a5")}>faltam pênaltis</span>
                      : done ? <span style={S.slotChip("#14532d", "#86efac")}>encerrado</span>
                      : live ? <span style={S.slotChip("#7f1d1d", "#fca5a5")}>em jogo</span>
                      : next ? <span style={S.slotChip("#78350f", "#fde68a")}>próximo</span>
                      : sl.tipo === "previa" ? <span style={S.slotChip("#1e293b", "#94a3b8")}>a definir</span> : null}
                  </div>
                  {(() => {
                    const porPos = sl.tipo === "previa" || sl.ko;
                    const n = sl.tipo === "previa" ? sl.linhas.length : sl.jogos.length;
                    const acao = () => porPos ? sortearPosicoes(sl.key, n) : sortearCampos(sl.key, sl.jogos.map((j) => j.m.id));
                    if (sorteando === sl.key) return <div style={S.sorteioBox}>🎲 Sorteando os campos…</div>;
                    if (!sl.sorteado) {
                      if (!edit) return sl.regra ? null : <div style={S.sorteioHint}>Campos ainda não sorteados.</div>;
                      if (!porPos && !sl.pronto) return <div style={S.sorteioHint}>O sorteio libera quando os times deste horário estiverem definidos.</div>;
                      return <button style={S.sorteioBtn} onClick={acao}>🎲 Sortear campos do {sl.horario}º horário</button>;
                    }
                    return edit && !sl.iniciado ? <button style={S.sorteioLink} onClick={acao}>🎲 Sortear de novo</button> : null;
                  })()}
                  {sl.regra && <div style={S.sorteioHint}>⚖️ {agenda.prio.filter((id) => id != null && sl.jogos.some((j) => { const t = teamsOf(j.m) || {}; return t.A === id || t.B === id; })).map((id) => nomeDoTime(id)).join(" e ")} neste horário: o campo segue a regra de prioridade.</div>}
                  {sl.tipo === "previa" && sl.sorteado && <div style={S.sorteioHint}>Se Galwan ou Os Fiéis chegarem aqui, a regra de prioridade vale por cima do sorteio.</div>}
                  {avisoSorteio && avisoSorteio.key === sl.key && <div style={{ fontSize: 12, color: "#fca5a5", margin: "0 2px 8px" }}>{avisoSorteio.msg}</div>}
                  {pendPen.length > 0 && (
                    <div style={S.alertaPen}>⚠️ {pendPen.map((j) => { const t = teamsOf(j.m) || {}; return nomeDoTime(t.A) + " x " + nomeDoTime(t.B); }).join(" e ")} terminou empatado. Toque no jogo e informe os pênaltis para definir quem avança.</div>
                  )}
                  {sl.tipo === "previa" ? sl.linhas.map((txt, k) => ({ txt, k, c: sl.pos ? sl.pos[k] : null }))
                    .sort((x, y) => (x.c || 9) - (y.c || 9) || x.k - y.k).map(({ txt, k, c }) => (
                    <div key={k}>
                      <div style={S.campoLabel(c)}>{c ? c + "º campo" : "Campo a sortear"}</div>
                      <div style={{ ...S.matchCard, opacity: 0.6 }}><div style={S.matchTeams}>{txt}</div></div>
                    </div>
                  )) : sl.jogos.map((j) => {
                    const { A, B } = teamsOf(j.m) || {};
                    return (
                      <div key={j.m.id}>
                        <div style={S.campoLabel(j.campo)}>{j.campo ? j.campo + "º campo" : "Campo a sortear"}{j.m.ko && j.m.fase && j.m.fase !== "Semifinal" ? " · " + j.m.fase : ""}</div>
                        <MatchLine m={j.m} a={A} b={B} nome={nomeDoTime} gol={golsNo}
                          onOpen={A && B ? () => setAtiva(j.m.id) : null} pen={j.m.ko ? { a: j.m.penA, b: j.m.penB } : null} semPen={faltaPen(j.m)} />
                      </div>
                    );
                  })}
                </div>
              );
            })}
          </>)}
        </div>
      )}

      {tela === "grupos" && (
        <div style={S.body}>
          {grupos.length === 0 ? (
            <div style={S.card}>
              <div style={{ ...S.sectionTitle, marginBottom: 10 }}><Users size={18} /> Grupos do torneio</div>
              <div style={{ fontSize: 13, color: "#94a3b8", marginBottom: 12 }}>Os dois grupos já estão definidos, na ordem combinada. Toque para montá-los.</div>
              {edit ? <button style={S.primaryBtn} onClick={montarGrupos}>Carregar os 2 grupos</button>
                    : <div style={S.empty}>Aguardando o organizador montar os grupos.</div>}
            </div>
          ) : (
            <>
              {edit && (
              <div style={{ marginBottom: 14 }}>
                <div style={{ display: "flex", gap: 8 }}>
                  {confirmRestart ? (
                    <>
                      <button style={{ ...S.resetConfirm, padding: "10px 12px", fontSize: 13 }} onClick={zerarResultados}>Zerar placares</button>
                      <button style={S.ghostBtn} onClick={() => setConfirmRestart(false)}>Cancelar</button>
                    </>
                  ) : (
                    <button style={S.ghostBtn} onClick={() => setConfirmRestart(true)}><RefreshCw size={15} /> Zerar placares</button>
                  )}
                  {[2, 4, 8].includes(grupos.length) && (
                    <button style={{ ...S.primaryBtn, opacity: todosGruposFim ? 1 : 0.4 }} disabled={!todosGruposFim} onClick={gerarMata}>
                      <GitMerge size={16} /> {bracket ? "Refazer chave" : "Gerar mata-mata"}
                    </button>
                  )}
                </div>
                {confirmRestart && <div style={{ fontSize: 12, color: "#94a3b8", marginTop: 8 }}>Apaga só gols, cartões e resultados. Times, jogadores e escudos são preservados.</div>}
              </div>
              )}
              {edit && !todosGruposFim && [2, 4, 8].includes(grupos.length) &&
                <div style={{ fontSize: 12, color: "#64748b", marginBottom: 12 }}>Encerre todos os jogos de grupo (🏳️) para liberar o mata-mata.</div>}

              <div style={{ fontSize: 12, color: "#94a3b8", marginBottom: 14, lineHeight: 1.5 }}>
                Todos se enfrentam dentro do grupo. Classificam-se os <b style={{ color: "#22c55e" }}>2 primeiros</b>, ordenados por número de <b style={{ color: "#3b82f6" }}>vitórias</b>. Empate em vitórias: saldo de gols → gols pró → confronto direto.
              </div>

              {grupos.map((g) => (
                <div key={g.id} style={{ marginBottom: 22 }}>
                  <div style={S.groupTitle}>Grupo {g.nome}</div>
                  <div style={S.table}>
                    <div style={{ ...S.tRow, ...S.tHead }}>
                      <span style={S.tPos}>#</span><span style={S.tName}>Time</span>
                      <span style={S.tCell}>P</span><span style={S.tCell}>J</span>
                      <span style={{ ...S.tCell, color: "#3b82f6" }}>V</span><span style={S.tCell}>E</span>
                      <span style={S.tCell}>D</span><span style={S.tCell}>SG</span>
                    </div>
                    {standings[g.id]?.map((s, i) => (
                      <div key={s.id} style={{ ...S.tRow, background: i < 2 ? "#12351f" : "transparent" }}>
                        <span style={S.tPos}>{i + 1}</span>
                        <span style={{ ...S.tName, display: "flex", alignItems: "center", gap: 6, minWidth: 0 }}>
                          <Escudo time={timeObj(s.id)} size={16} />
                          <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{nomeDoTime(s.id)}</span>
                        </span>
                        <span style={S.tCell}>{s.pts}</span>
                        <span style={S.tCell}>{s.j}</span><span style={{ ...S.tCell, fontWeight: 700, color: "#3b82f6" }}>{s.v}</span>
                        <span style={S.tCell}>{s.e}</span><span style={S.tCell}>{s.d}</span>
                        <span style={S.tCell}>{s.gp - s.gc}</span>
                      </div>
                    ))}
                  </div>
                </div>
              ))}
              <button style={{ ...S.ghostBtn, width: "100%", marginBottom: 14 }} onClick={() => setTela("agenda")}>
                <Clock size={16} /> Ver a ordem dos jogos
              </button>
              {grupos.length === 1 && standings[grupos[0].id]?.length > 0 && todosGruposFim && (
                <div style={S.champBanner}><Crown size={20} /> Campeão da liga: <b>{nomeDoTime(standings[grupos[0].id][0].id)}</b></div>
              )}
            </>
          )}
        </div>
      )}

      {/* -------- MATA-MATA -------- */}
      {tela === "mata" && (
        <div style={S.body}>
          {!bracket ? (
            <div style={S.empty}>Gere o mata-mata na aba Grupos depois de encerrar a fase de grupos.</div>
          ) : (
            <>
              {resolve.champion && (
                <div style={S.champBanner}><Crown size={22} color="#0f172a" /> Campeão: <b>{nomeDoTime(resolve.champion)}</b></div>
              )}
              {resolve.third && (
                <div style={S.thirdBanner}><Award size={16} /> 3º lugar: {nomeDoTime(resolve.third)}</div>
              )}
              {bracket.rounds.map((rd, ri) => {
                const ms = rd.map((id) => matches.find((x) => x.id === id)).filter(Boolean);
                if (!ms.length) return null;
                return (
                  <div key={ri} style={{ marginBottom: 20 }}>
                    <div style={S.groupTitle}>{ms[0].fase}</div>
                    {porCampo(ms).map((m) => {
                      const { A, B } = teamsOf(m);
                      return <MatchLine key={m.id} m={m} a={A} b={B} nome={nomeDoTime} gol={golsNo}
                        onOpen={A && B ? () => setAtiva(m.id) : null} pen={{ a: m.penA, b: m.penB }} campo={campoDe[m.id]} semPen={faltaPen(m)} />;
                    })}
                  </div>
                );
              })}
            </>
          )}
        </div>
      )}

      {/* -------- ARTILHARIA -------- */}
      {tela === "stats" && (
        <div style={S.body}>
          <div style={{ display: "flex", gap: 6, marginBottom: 14 }}>
            <button style={S.tab(statsView === "times")} onClick={() => setStatsView("times")}>Por time</button>
            <button style={S.tab(statsView === "rank")} onClick={() => setStatsView("rank")}>Rankings</button>
          </div>

          {statsView === "times" && (<>
            <div style={{ fontSize: 12, color: "#64748b", marginBottom: 10 }}>Toque num time para ver os jogadores e o que cada um fez.</div>
            {estat.porTime.map((t) => (
              <div key={t.id} style={S.card}>
                <div style={S.cardHead} onClick={() => setStatTime(statTime === t.id ? null : t.id)}>
                  <span style={{ display: "flex", alignItems: "center", gap: 8, minWidth: 0, flex: 1 }}>
                    <Escudo time={timeObj(t.id)} size={24} />
                    <span style={{ minWidth: 0 }}>
                      <b style={{ display: "block", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{t.nome}</b>
                      <span style={{ fontSize: 11, color: "#64748b" }}>{t.j} jogos · {t.v}V {t.e}E {t.d}D · SG {t.gp - t.gc >= 0 ? "+" : ""}{t.gp - t.gc}</span>
                    </span>
                  </span>
                  <span style={{ ...S.pctBig, color: t.aprov >= 60 ? "#22c55e" : t.aprov >= 34 ? "#eab308" : "#ef4444" }}>{t.j ? t.aprov + "%" : "–"}</span>
                </div>
                {statTime === t.id && (
                  <div style={S.cardBody}>
                    <div style={{ display: "flex", gap: 6, padding: "10px 0 12px" }}>
                      <div style={S.statChip}><b style={{ fontSize: 15 }}>{t.gp}</b><span style={S.chipLb}>gols pró</span></div>
                      <div style={S.statChip}><b style={{ fontSize: 15 }}>{t.gc}</b><span style={S.chipLb}>sofridos</span></div>
                      <div style={S.statChip}><b style={{ fontSize: 15 }}>{t.cs}</b><span style={S.chipLb}>sem sofrer</span></div>
                    </div>
                    {t.jogadores.length === 0 && <div style={S.empty}>Nenhum jogador cadastrado neste time.</div>}
                    {t.jogadores.map((p) => {
                      const gk = p.ehGoleiro;
                      return (
                        <div key={p.id} style={S.playerStat}>
                          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                            <b style={{ color: "#3b82f6", width: 24, flex: "none" }}>{p.numero || "–"}</b>
                            <span style={{ flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                              {p.nome}{gk && <span style={S.posTag}>GOL</span>}
                            </span>
                            {gk ? (
                              <span style={{ ...S.pctSmall, color: p.media == null ? "#475569" : p.media <= 1 ? "#22c55e" : p.media <= 2 ? "#eab308" : "#ef4444" }}>
                                {p.media == null ? "–" : p.media.toFixed(2)}
                              </span>
                            ) : (
                              <span style={{ ...S.pctSmall, color: p.aprov == null ? "#475569" : p.aprov >= 60 ? "#22c55e" : p.aprov >= 30 ? "#eab308" : "#94a3b8" }}>
                                {p.aprov == null ? "–" : p.aprov + "%"}
                              </span>
                            )}
                          </div>
                          <div style={{ fontSize: 11, color: "#94a3b8", marginTop: 4, display: "flex", flexWrap: "wrap", gap: 8 }}>
                            <span>⚽ {p.gols}</span><span>🤝 {p.assist}</span>
                            {(p.amarelos > 0 || p.vermelhos > 0) && <span>🟨 {p.amarelos} 🟥 {p.vermelhos}</span>}
                            <span style={{ color: "#64748b" }}>
                              {gk ? p.golsSofridos + " sofridos em " + p.jogos + " jogos" : p.part + " part. em " + p.jogos + " jogos"}
                            </span>
                          </div>
                          {p.medalhas.length > 0 && (
                            <div style={{ display: "flex", flexWrap: "wrap", gap: 4, marginTop: 5 }}>
                              {p.medalhas.map((m, i) => <span key={i} style={S.medalChip}>{m.e} {m.t}</span>)}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            ))}
          </>)}

          {statsView === "rank" && (<>
            <div style={{ ...S.sectionTitle, marginBottom: 4 }}><Goal size={18} color="#f59e0b" /> Artilheiros</div>
            {estat.artilheiros.length === 0 && <div style={S.empty}>Marque gols para ver os artilheiros.</div>}
            {estat.artilheiros.map((a, i) => (
              <div key={a.id} style={S.rankRow}>
                <span style={{ ...S.rankPos, background: i === 0 ? "#f59e0b" : i === 1 ? "#94a3b8" : i === 2 ? "#b45309" : "#334155" }}>{i + 1}</span>
                <span style={{ flex: 1, minWidth: 0 }}><b>{a.nome}</b><div style={{ fontSize: 12, color: "#64748b" }}>{a.time}</div></span>
                <span style={S.golCount}><Goal size={15} /> {a.gols}</span>
              </div>
            ))}

            {estat.garcons.length > 0 && (<>
              <div style={{ ...S.sectionTitle, margin: "22px 0 8px" }}><Handshake size={17} color="#38bdf8" /> Garçons (assistências)</div>
              {estat.garcons.map((a) => (
                <div key={a.id} style={S.rankRow}>
                  <span style={{ flex: 1, minWidth: 0 }}><b>{a.nome}</b><div style={{ fontSize: 12, color: "#64748b" }}>{a.time}</div></span>
                  <span style={{ ...S.golCount, color: "#38bdf8" }}><Handshake size={15} /> {a.assist}</span>
                </div>
              ))}
            </>)}

            {estat.goleiros.length > 0 && (<>
              <div style={{ ...S.sectionTitle, margin: "22px 0 8px" }}><Hand size={17} color="#34d399" /> Goleiro menos vazado</div>

// ============ COMPONENTES ============
function MatchLine({ m, a, b, nome, gol, onOpen, pen, campo, semPen }) {
  const gA = a ? gol(m, a) : 0, gB = b ? gol(m, b) : 0;
  return (
    <div style={{ ...S.matchCard, opacity: onOpen ? 1 : 0.7, cursor: onOpen ? "pointer" : "default" }} onClick={onOpen || undefined}>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={S.matchTeams}>{a ? nome(a) : "A definir"} <span style={{ color: "#475569" }}>×</span> {b ? nome(b) : "A definir"}</div>
        <div style={S.matchScore}>
          {gA} – {gB}
          {pen && pen.a != null && pen.b != null && <span style={{ color: "#a78bfa" }}> (pên {pen.a}-{pen.b})</span>}
          {m.finalizada && (semPen
            ? <span style={{ ...S.miniTag, background: "#7f1d1d", color: "#fca5a5" }}>faltam os pênaltis</span>
            : <span style={S.miniTag}>encerrada</span>)}
          {campo && <span style={S.campoTag(campo.campo)}>{campo.horario}º horário{campo.campo ? " · " + campo.campo + "º campo" : ""}</span>}
        </div>
      </div>
      {onOpen && <Play size={20} color="#22c55e" />}
    </div>
  );
}

function PainelTime({ time, adv, mid, add }) {
  const [jog, setJog] = useState("");
  if (!time) return null;
  const reg = (tipo) => {
    const j = time.jogadores.find((x) => x.id === +jog);
    if ((tipo === "gol" || tipo === "assist") && !j) return;
    add(mid, { tipo, time: time.id, jogadorId: j?.id ?? null, jogadorNome: j ? j.nome : "(sem nº)" });
    setJog("");
  };
  const contra = () => {
    const j = time.jogadores.find((x) => x.id === +jog);
    if (!j) return;
    add(mid, { tipo: "gol", time: adv.id, jogadorId: j.id, jogadorNome: j.nome, contra: true });
    setJog("");
  };
  return (
    <div style={S.panel}>
      <div style={S.panelTitle}>{time.nome}</div>
      <select style={S.selectSm} value={jog} onChange={(e) => setJog(e.target.value)}>
        <option value="">Jogador…</option>
        {time.jogadores.sort((a, b) => (+a.numero || 99) - (+b.numero || 99)).map((j) => (
          <option key={j.id} value={j.id}>{j.numero ? j.numero + " · " : ""}{j.nome}</option>
        ))}
      </select>
      <button style={{ ...S.evBtn, borderColor: "#22c55e", color: "#22c55e" }} onClick={() => reg("gol")}><Goal size={15} /> Gol</button>
      <div style={S.evGrid}>
        <button style={S.evSm("#38bdf8")} onClick={() => reg("assist")}><Handshake size={12} /> Assist.</button>
        <button style={S.evSm("#eab308")} onClick={() => reg("amarelo")}><Square size={12} fill="#eab308" /> Amar.</button>
        <button style={S.evSm("#ef4444")} onClick={() => reg("vermelho")}><Square size={12} fill="#ef4444" /> Verm.</button>
        <button style={S.evSm("#a78bfa")} onClick={() => reg("sub")}><ArrowLeftRight size={12} /> Subst.</button>
        <button style={S.evSm("#94a3b8")} onClick={contra}><Goal size={12} /> Contra</button>
      </div>
    </div>
  );
}

function EvIcon({ e }) {
  if (e.tipo === "gol") return <Goal size={16} color={e.contra ? "#ef4444" : "#22c55e"} />;
  if (e.tipo === "assist") return <Handshake size={15} color="#38bdf8" />;
  if (e.tipo === "amarelo") return <Square size={14} fill="#eab308" color="#eab308" />;
  if (e.tipo === "vermelho") return <Square size={14} fill="#ef4444" color="#ef4444" />;
  if (e.tipo === "sub") return <ArrowLeftRight size={15} color="#a78bfa" />;
  return <Goal size={16} />;
}

function StatusPill({ status }) {
  const map = {
    idle: { c: "#22c55e", t: "Salvo", dot: "#22c55e" },
    saving: { c: "#eab308", t: "Salvando…", dot: "#eab308" },
    saved: { c: "#22c55e", t: "Salvo", dot: "#22c55e" },
    error: { c: "#ef4444", t: "Erro ao salvar", dot: "#ef4444" },
    off: { c: "#64748b", t: "Só memória", dot: "#64748b" },
  };
  const s = map[status] || map.idle;
  return (
    <span style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11, color: s.c }}>
      <span style={{ width: 7, height: 7, borderRadius: "50%", background: s.dot, display: "inline-block" }} />
      {s.t}
    </span>
  );
}

function Escudo({ time, size = 20 }) {
  if (time && time.escudo)
    return <img src={time.escudo} alt="" style={{ width: size, height: size, borderRadius: 4, objectFit: "cover", display: "block", background: "#0f172a" }} />;
  return <Shield size={size} color="#3b82f6" />;
}

function NavBtn({ on, click, icon, label }) {
  return (
    <button style={{ ...S.navBtn, color: on ? "#3b82f6" : "#64748b" }} onClick={click}>
      {icon}<span style={{ fontSize: 10, marginTop: 2 }}>{label}</span>
    </button>
  );
}
